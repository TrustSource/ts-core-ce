<template name="moduleSettings">

  {{#pageHeader headerClass=getStatistics.getState}}
    <div class="modules-header">
      <div class="modules-header-left">
        <h2 class="font-light m-b-xs">
          <span class="truncate max-w-80" title="{{name}}">{{name}}</span>
          {{>leanixLink leanix=leanix}}
        </h2>
        <small>Edit Module</small>
      </div>
      <div class="modules-header-actions">
        {{>followAction type='module' item=this}}
      </div>
    </div>
  {{/pageHeader}}

  <div class="content">
    <div class="ts-panel">

      <form name="simpleForm" novalidate id="simpleForm" action="#" method="post">

        <div class="nav-tabs-scrollable">
          <button class="nav-tabs-arrow nav-tabs-arrow-left" type="button"><i class="fa fa-chevron-left"></i></button>
          <button class="nav-tabs-arrow nav-tabs-arrow-right" type="button"><i class="fa fa-chevron-right"></i></button>
          <ul class="nav nav-tabs">
            {{#if hasAccessRight 'module.general' 'r' currentModule}}
              <li id="general-tab" class="active"><a data-toggle="tab" href="#general">General</a></li>
            {{/if}}
            {{#if hasAccessRight 'module.legal' 'r' currentModule}}
              <li id="legal-tab"><a data-toggle="tab" href="#legal">Legal</a></li>
            {{/if}}
            {{#unless isInfrastructureModule}}
              {{#if hasAccessRight 'module.quality' 'r' currentModule}}
                <li id="quality-tab"><a data-toggle="tab" href="#quality">Quality</a></li>
              {{/if}}
              {{#if hasAccessRight 'module.encryption' 'r' currentModule}}
                <li id="encryption-tab"><a data-toggle="tab" href="#encryption">Crypto management</a></li>
                <li id="aibom-tab"><a data-toggle="tab" href="#aibom">AI / ML</a></li>
              {{/if}}
              {{#if hasAccessRight 'module.wblist' 'r' currentModule}}
                <li><a data-toggle="tab" href="#wblist">Allow/Deny</a></li>
              {{/if}}
              {{#if hasAccessRight 'module.capabilities' 'r' currentModule}}
                <li id="capabilities-tab"><a data-toggle="tab" href="#capabilities">Capabilities</a></li>
              {{/if}}
            {{/unless}}
            {{#if hasAccessRight 'module.endoflife' 'r' currentModule}}
              <li><a data-toggle="tab" href="#endoflife">End-of-life</a></li>
            {{/if}}
            {{#if hasAccessRight 'module.cia' 'r' currentModule}}
              <li id="risk-tab"><a data-toggle="tab" href="#risk">CIA</a></li>
            {{/if}}
            {{#if hasAccessRight 'module.obligationConfig' 'r' currentModule}}
              <li id="obligations-tab"><a data-toggle="tab" href="#obligations">Resolved obligations</a></li>
            {{/if}}
            {{#if hasAccessRight 'module.viability' 'r' currentModule}}
              <li id="viability-tab"><a data-toggle="tab" href="#viability">Viability</a></li>
            {{/if}}
            {{#if hasAccessRight 'module.versioning' 'r' currentModule}}
              <li id="versioning-tab"><a data-toggle="tab" href="#versioning">Versioning</a></li>
            {{/if}}
            {{#if hasAccessRight 'module.cveWhitelist' 'r' currentModule}}
              <li><a data-toggle="tab" href="#cveWhitelist">Allowed vulnerability</a></li>
            {{/if}}
            {{#unless isInfrastructureModule}}
              {{#if hasAccessRight 'module.customComponents' 'r' currentModule}}
                <li><a data-toggle="tab" href="#customComponents">Custom components</a></li>
              {{/if}}
              {{#if hasAccessRight 'module.releases' 'r' currentModule}}
                <li id="releases-tab"><a data-toggle="tab" href="#releases">History</a></li>
              {{/if}}
              {{#if hasAccessRight 'module.SPDXExportTab' 'r' currentModule}}
                <li><a data-toggle="tab" href="#SPDXExportTab">Export SPDX</a></li>
              {{/if}}
            {{/unless}}
            {{#if hasAccessRight 'module.danger' 'r' currentModule}}
              <li><a data-toggle="tab" href="#danger">Danger Operations</a></li>
            {{/if}}
          </ul>
        </div>

        <div class="tab-content">
          {{#if hasAccessRight 'module.general' 'r' currentModule}}
            <div id="general" class="tab-pane active">        <!-- General settings -->
              <div class="panel-body">
                {{#autoForm id="updateModuleForm" collection=getModules
                            schema=getModuleSchema type="update" doc=currentModule
                            class="form-horizontal"
                }}
                  <fieldset>
                    {{#with hasFieldRight 'module.general.name' currentModule}}
                      {{#if read}}
                        {{> afQuickField name='name' template="bootstrap3-horizontal"
                                label-class="col-md-3" input-col-class="col-md-9" disabled=disabled}}
                      {{/if}}
                    {{/with}}
                    {{#if isInfrastructureModule}}
                      {{#with hasFieldRight 'module.general.version' currentModule}}
                        {{#if read}}
                          {{> afQuickField name='version' template="bootstrap3-horizontal"
                                  label-class="col-md-3" input-col-class="col-md-9" disabled=disabled}}
                        {{/if}}
                      {{/with}}
                    {{/if}}
                    {{#with hasFieldRight 'module.general.description' currentModule}}
                      {{#if read}}
                        {{> afQuickField name='description' rows=3  template="bootstrap3-horizontal"
                                label-class="col-md-3" input-col-class="col-md-9" disabled=disabled}}
                      {{/if}}
                    {{/with}}
                    {{#with hasFieldRight 'module.general.projectId' currentModule}}
                      {{#if read}}
                        {{> afQuickField name='projectId'  template="bootstrap3-horizontal"
                                label-class="col-md-3" input-col-class="col-md-9" options=projectOptions
                                firstOption="-- unassigned --" disabled=disabled}}
                      {{/if}}
                    {{/with}}
                    {{#with hasFieldRight 'module.general.architectureType' currentModule}}
                      {{#if read}}
                        {{> afQuickField name='properties.architectureType'  template="bootstrap3-horizontal"
                                label-class="col-md-3" input-col-class="col-md-9"
                                firstOption="-- Select one --" disabled=disabled}}
                      {{/if}}
                    {{/with}}
                    {{#with hasFieldRight 'module.general.tags' currentModule}}
                      {{#if read}}
                        {{#if getCompanyTags}}
                          {{> afQuickField name='tags' template="bootstrap3-horizontal" label-class="col-md-3"
                                  input-col-class="col-md-9" options=getCompanyTags disabled=disabled}}
                        {{/if}}
                        {{#if hasNoCompanyTags}}
                          <div class="form-group">
                            <label class="col-md-3 control-label">Tags</label>
                            <div class="col-md-9">
                              <a href="{{pathFor route='companyTags'}}"
                                 style="padding: 7px 0;display: inline-block;margin: 0 0;">
                                No tags in company. View company tags.
                              </a>
                            </div>
                          </div>
                        {{/if}}
                        {{#if inProgressGetCompanyTags}}
                          <div class="form-group">
                            <label class="col-md-3 control-label">Tags</label>
                            <div class="col-md-9"><span
                                    style="padding: 2px 0 0;display: inline-block;margin: 0 0;"><span
                                    class="fa fa-spinner fa-spin fa-2x"></span></span></div>
                          </div>
                        {{/if}}
                      {{/if}}
                    {{/with}}
                    {{#with hasFieldRight 'module.general.relatedUsers.defaultProjectManager' currentModule}}
                      {{#if read}}
                        {{#if getUsersManagers}}
                          {{> afQuickField name='relatedUsers.defaultProjectManager' template="bootstrap3-horizontal" label-class="col-md-3"
                                  input-col-class="col-md-9" options=getUsersManagers disabled=disabled}}
                        {{/if}}
                        {{#if hasNoUsersManagers}}
                          <div class="form-group">
                            <label class="col-md-3 control-label">Default project manager</label>
                            <div class="col-md-9">
                              <a href="{{pathFor route='companyUsers'}}"
                                 style="padding: 7px 0;display: inline-block;margin: 0 0;">
                                No project manager in company. View company users.
                              </a>
                            </div>
                          </div>
                        {{/if}}
                        {{#if inProgressGetUsersManagers}}
                          <div class="form-group">
                            <label class="col-md-3 control-label">Default project manager</label>
                            <div class="col-md-9"><span
                                    style="padding: 7px 0;display: inline-block;margin: 0 0;"><span
                                    class="fa fa-spinner fa-spin fa-2x"></span></span></div>
                          </div>
                        {{/if}}
                      {{/if}}
                    {{/with}}
                    {{#with hasFieldRight 'module.general.relatedUsers.defaultComplianceManager' currentModule}}
                      {{#if read}}
                        {{#if getUsersComplianceManagers}}
                          {{> afQuickField name='relatedUsers.defaultComplianceManager' template="bootstrap3-horizontal" label-class="col-md-3"
                                  input-col-class="col-md-9" options=getUsersComplianceManagers disabled=disabled}}
                        {{/if}}
                        {{#if hasNoUsersComplianceManagers}}
                          <div class="form-group">
                            <label class="col-md-3 control-label">Default compliance manager</label>
                            <div class="col-md-9">
                              <a href="{{pathFor route='companyUsers'}}"
                                 style="padding: 7px 0;display: inline-block;margin: 0 0;">
                                No compliance manager in company. View company users.
                              </a>
                            </div>
                          </div>
                        {{/if}}
                        {{#if inProgressGetUsersComplianceManagers}}
                          <div class="form-group">
                            <label class="col-md-3 control-label">Default compliance manager</label>
                            <div class="col-md-9"><span
                                    style="padding: 7px 0;display: inline-block;margin: 0 0;"><span
                                    class="fa fa-spinner fa-spin fa-2x"></span></span></div>
                          </div>
                        {{/if}}
                      {{/if}}
                    {{/with}}
                    {{#with hasFieldRight 'module.general.relatedUsers.members' currentModule}}
                      {{#if read}}
                        {{#if getUsers}}
                          {{> afQuickField name='relatedUsers.members' template="bootstrap3-horizontal" label-class="col-md-3"
                                  input-col-class="col-md-9" options=getUsers disabled=disabled}}
                        {{/if}}
                        {{#if hasNoUsers}}
                          <div class="form-group">
                            <label class="col-md-3 control-label">Members</label>
                            <div class="col-md-9">
                              <a href="{{pathFor route='companyUsers'}}"
                                 style="padding: 7px 0;display: inline-block;margin: 0 0;">
                                No users in company. View company users.
                              </a>
                            </div>
                          </div>
                        {{/if}}
                        {{#if inProgressGetUsers}}
                          <div class="form-group">
                            <label class="col-md-3 control-label">Members</label>
                            <div class="col-md-9"><span
                                    style="padding: 7px 0;display: inline-block;margin: 0 0;"><span
                                    class="fa fa-spinner fa-spin fa-2x"></span></span></div>
                          </div>
                        {{/if}}
                      {{/if}}
                    {{/with}}
                    {{#with hasFieldRight 'module.general.leanix' currentModule}}
                      {{#if read}}
                        {{#if getLeanixProjects}}
                          {{> afQuickField name='leanix' template="bootstrap3-horizontal" label-class="col-md-3"
                                  input-col-class="col-md-9" options=getLeanixProjects disabled=disabled}}
                        {{/if}}
                        {{#unless hasLeanix}}
                          <div class="form-group">
                            <label class="col-md-3 control-label">Link with LeanIX</label>
                            <div class="col-md-9"><a href="{{pathFor route='companyIntegrations'}}"
                                                     style="padding: 7px 0 0;display: inline-block;margin: 0 0;">Update
                              LeanIX settings</a></div>
                          </div>
                        {{/unless}}
                        {{#if hasLeanixAndNotLeanixProjects}}
                          <div class="form-group">
                            <label class="col-md-3 control-label">Link with LeanIX</label>
                            <div class="col-md-9"><span
                                    style="padding: 7px 0 0;display: inline-block;margin: 0 0;"><span
                                    class="fa fa-spinner fa-spin fa-2x"></span></span></div>
                          </div>
                        {{/if}}
                      {{/if}}
                    {{/with}}
                    {{#if isInfrastructureModule}}
                      {{#with hasFieldRight 'module.general.properties.privacy' currentModule}}
                        {{#if read}}
                          {{> afQuickField name='properties.privacy' template="bootstrap3-horizontal"
                                  label-class="col-md-3" input-col-class="col-md-9" disabled=disabled}}
                        {{/if}}
                      {{/with}}
                    {{/if}}
                    {{#with hasFieldRight 'module.general.moduleIdentifier' currentModule}}
                      {{#if read}}
                        {{> afQuickField name='moduleIdentifier' readonly=true  template="bootstrap3-horizontal"
                                label-class="col-md-3" input-col-class="col-md-9" disabled=disabled}}
                      {{/if}}
                    {{/with}}
                    {{#with hasFieldRight 'module.general.name' currentModule}}
                      {{#if read}}
                        {{> afQuickField name='confidenceMinScore' template="bootstrap3-horizontal"
                          label-class="col-md-3" input-col-class="col-md-9" disabled=disabled}}
                        {{#if inheritedConfidenceHint}}
                          <div class="form-group">
                            <div class="col-md-9 col-md-offset-3">
                              <small class="text-muted">Inheriting from project: {{inheritedConfidenceHint}}</small>
                            </div>
                          </div>
                        {{/if}}
                      {{/if}}
                    {{/with}}
                    {{#with hasFieldRight 'module.general.name' currentModule}}
                      {{#if read}}
                        {{> afQuickField name='urls.repository' template="bootstrap3-horizontal"
                          label-class="col-md-3" input-col-class="col-md-9"}}
                      {{/if}}
                    {{/with}}
                  </fieldset>
                  {{#if hasAccessRight 'module.general' 'w' currentModule}}
                    <div class="row">
                      <div class="col-md-9 col-md-offset-3">
                        <button type="submit" class="btn btn-primary">Update</button>
                      </div>
                    </div>
                  {{/if}}
                {{/autoForm}}
              </div>
            </div>
          {{/if}}
          {{#if hasAccessRight 'module.legal' 'r' currentModule}}
            {{> moduleSettingsLegal}}
          {{/if}}
          {{#if hasAccessRight 'module.viability' 'r' currentModule}}
            <div id="viability" class="tab-pane">                   <!-- Viabilities -->
              <div class="panel-body inner-lr-40 no-bottom-errors">
                {{> crawlerDataNotice check='viability'}}
                <div class="pull-right actions actions-wizard relative">
                  {{#if hasAccessRight 'module.viability.import' 'x' currentModule}}
                    <div class="inline-block relative">
                      {{#if getViabilitySettingsModules.length}}
                        <button type="button" class="btn btn-default btn-xs dropdown-toggle"
                                data-toggle="dropdown">
                          <span class="fa fa-copy"></span> Import settings from Module <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu">
                          <li>
                            <input type="text" class="drop-filter form-control import_filter"
                                   placeholder="Search by name"
                                   value="{{getImportFilter}}"/>
                          </li>
                          {{#each filterList getViabilitySettingsModules getImportFilter}}
                            <li><a class="copy-viability-settings" id="{{_id}}">{{name}}</a></li>
                          {{/each}}
                        </ul>
                      {{/if}}
                    </div>
                  {{/if}}
                </div>
                <h3>Viability analysis</h3>
                {{#with hasFieldRight 'module.viability.viabilityConfig.enabled' currentModule}}
                  {{#if read}}
                    <div class="row">
                      <div class="col-lg-12">
                        <div class="checkbox">
                          <label>
                            <input type="checkbox" checked="{{getViabilityConfig.enabled}}"
                                   name="viabilityConfigEnabled"
                                   value="true" id="companyViabilityConfigEnabled" class="ios-toggle "
                                   disabled={{disabled}}>
                            <span for="companyViabilityConfigEnabled" class="checkbox-label" data-off="off"
                                  data-on="on"></span>
                            <span style="display: inline-block;margin: 9px 0 0 30px;float: left;">Enable viability analysis for module</span>
                          </label>
                        </div>
                      </div>
                    </div>
                  {{/if}}
                {{/with}}
                {{#if getViabilityConfig.enabled}}
                  {{# autoForm
                    id="updateModuleForm3"
                    docId=currentModule._id
                    collection=getModules
                    schema=getModuleViabilityConfigSchema
                    doc=getViabilityConfig
                    type="normal"
                  }}
                    <h3>Viability thresholds</h3>
                    <div class="row">
                      <div class="col-xs-9 text-danger" style="padding-top: 15px">
                        <!-- for the moment, warningThreshold and violationThreshold should contain same text -->
                        {{#if afFieldIsInvalid name='warningThreshold'}}
                          {{afFieldMessage name='warningThreshold'}}
                        {{/if}}
                      </div>
                    </div>
                    <div class="row inner-b-50">
                      <div class="col-md-5">
                        {{#with hasFieldRight 'module.viability.warningThreshold' currentModule}}
                          {{#if read}}{{> afQuickField name='warningThreshold' disabled=disabled}}
                          {{/if}}
                        {{/with}}
                      </div>
                      <div
                        class="col-md-5 col-md-offset-1">
                        {{#with hasFieldRight 'module.viability.violationThreshold' currentModule}}
                          {{#if read}}{{> afQuickField name='violationThreshold' disabled=disabled}}{{/if}}
                        {{/with}}
                      </div>
                    </div>
                    <h3>Confidence settings</h3>
                    <div class="row inner-b-50 no-bottom-errors">
                      <div class="col-md-5">
                        {{#with hasFieldRight 'module.viability.minConfidence' currentModule}}
                          {{#if read}}{{> afQuickField name='minConfidence' disabled=disabled}}{{/if}}
                        {{/with}}
                      </div>
                      <div class="col-md-5 col-md-offset-1">
                        {{#with hasFieldRight 'module.viability.noInfoLevel' currentModule}}
                          {{#if read}}
                            {{> afQuickField name='noInfoLevel' disabled=disabled}}
                          {{/if}}
                        {{/with}}
                      </div>
                    </div>
                    {{#if hasAccessRight 'module.viability' 'w' currentModule}}
                      <div class="row">
                        <div class="col-xs-3">
                          <button type="submit" class="btn btn-primary">Update</button>
                        </div>
                      </div>
                    {{/if}}
                  {{/ autoForm}}
                {{/if}}
              </div>
            </div>
          {{/if}}

          {{#if hasAccessRight 'module.obligationConfig' 'r' currentModule}}
            {{> moduleSettingsObligations}}
          {{/if}}
          {{#if hasAccessRight 'module.versioning' 'r' currentModule}}
            {{> moduleSettingsVersioning}}
          {{/if}}
          {{#if hasAccessRight 'module.cveWhitelist' 'r' currentModule}}
            <div id="cveWhitelist" class="tab-pane">
              <div class="panel-body">
                <h3>Allowed vulnerability</h3>
                <div class="row">
                  <div class="col-lg-12">
                    {{#with hasFieldRight 'module.cveWhitelist.list' currentModule}}
                      {{#if read}}
                        {{> cvelist
                          title="List of muted vulnerability of module"
                          id="prjCveWhitelst"
                          data=getWhitelistedCve
                          assocData=getBlacklistedCve
                          schema=getModuleCveEntrySchema
                          docId=currentModule._id
                          collection=getModules
                          attribute="cveConfig.whitelist"
                          readonly=disabled
                        }}
                      {{/if}}
                    {{/with}}
                  </div>
                </div>
              </div>
            </div>
          {{/if}}
          {{#if hasAccessRight 'module.cia' 'r' currentModule}}
            {{> moduleSettingsCIA}}
          {{/if}}
          {{#if hasAccessRight 'module.endoflife' 'r' currentModule}}
            <div id="endoflife" class="tab-pane no-bottom-errors">
              <div class="panel-body">
                <h3>Component end-of-life</h3>
                {{> crawlerDataNotice check='endoflife'}}
                <div class="row">
                  <div class="col-lg-12">
                    <div class="inner-lr-40">
                      <div class="row">
                        <div class="col-lg-12">
                          <div class="checkbox">
                            <label>
                              <input type="checkbox" checked="{{endoflifePolicy.enabled}}" name="endoflifeConfigEnabled"
                                     value="true" id="moduleEndoflifeConfigEnabled" class="ios-toggle" disabled={{disabled}}>
                              <span for="moduleEndoflifeConfigEnabled" class="checkbox-label" data-off="off" data-on="on"></span>
                              <span style="display: inline-block;margin: 9px 0 0 30px;float: left;">Enable end-of-life analysis for module</span>
                            </label>
                          </div>
                        </div>
                      </div>
                      {{#if endoflifePolicy.enabled}}
                        {{# autoForm
                          id="updateModuleFormEndoflifeConfig"
                          docId=currentModule._id
                          collection=getModules
                          schema=getEndoflifeSchema
                          doc=endoflifePolicy
                          type="normal"
                        }}
                          <h3>End-of-life thresholds</h3>
                          <div class="row inner-b-50">
                            <div class="col-md-5">
                              {{> afQuickField name='warningThreshold' disabled=disabled}}
                            </div>
                            <div
                              class="col-md-5 col-md-offset-1">
                              {{> afQuickField name='violationThreshold' disabled=disabled}}
                            </div>
                          </div>
                          <div class="row">
                            <div class="col-xs-12">
                              <button type="submit" class="btn btn-primary">Update</button>
                              <span class="text-danger m-l-sm">
                                {{#if afFieldIsInvalid name='warningThreshold'}}
                                  {{afFieldMessage name='warningThreshold'}}
                                {{/if}}
                              </span>
                            </div>
                          </div>
                        {{/ autoForm}}
                      {{/if}}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          {{/if}}
          {{#unless isInfrastructureModule}}
            {{#if hasAccessRight 'module.capabilities' 'r' currentModule}}
              {{> moduleSettingsCapabilities}}
            {{/if}}
            {{#if hasAccessRight 'module.quality' 'r' currentModule}}
              <div id="quality" class="tab-pane">
                <div class="panel-body">
                  <h3>Quality</h3>
                  <div class="row">
                    <div class="col-lg-12">
                      {{> qualitySettingsList
                        title="Define test requirements"
                        id="moduleCmpQualitySettings"
                        data=getQualitySettingsList
                        docId=currentModule._id
                        readonly=false
                      }}
                    </div>
                  </div>
                </div>
              </div>
            {{/if}}
            {{#if hasAccessRight 'module.encryption' 'r' currentModule}}
              <div id="encryption" class="tab-pane">
                <div class="panel-body">
                  <h3>Crypto management</h3>
                  <div class="row">
                    <div class="col-lg-12">
                      {{> algorithmsSettingsList
                        title="List of Algorithms as managed"
                        id="moduleCmpAlgorithmsSettings"
                        data=getAlgorithmSettingsList
                        foundAlgorithms=getFoundAlgorithmsList
                        docId=currentModule._id
                        readonly=false
                      }}
                    </div>
                  </div>
                </div>
              </div>
              <div id="aibom" class="tab-pane">
                <div class="panel-body">
                  <h3>AI / ML</h3>
                  <div class="row">
                    <div class="col-lg-12">
                      {{> aiModelsSettingsList
                        title="List of AI artifacts as managed"
                        id="moduleCmpAiModelsSettings"
                        data=getAiModelsSettingsList
                        foundAiModels=getFoundAiModelsList
                        docId=currentModule._id
                        readonly=false
                      }}
                    </div>
                  </div>
                </div>
              </div>
            {{/if}}
            {{#if hasAccessRight 'module.wblist' 'r' currentModule}}
              <div id="wblist" class="tab-pane">                   <!-- Allow/Deny -->
                <div class="panel-body">
                  <h3>Licenses</h3>
                  <div class="row">
                    {{#with hasFieldRight 'module.wblist.whitelist_license' currentModule}}
                      {{#if read}}
                        <div class="col-lg-6">
                          {{> moduleLicenseList
                                  title="Always allow license"
                                  id="prjLicWhitelst"
                                  data=getWhitelistedLicenses
                                  assocData=getBlacklistedLicenses
                                  schema=getModuleLicenseEntrySchema
                                  docId=currentModule._id
                                  collection=getModules
                                  attribute="licenseConfig.whitelist"
                                  readonly=disabled}}
                        </div>
                      {{/if}}
                    {{/with}}
                    {{#with hasFieldRight 'module.wblist.blacklist_license' currentModule}}
                      {{#if read}}
                        <div class="col-lg-6">
                          {{> moduleLicenseList
                                  title="Always deny license"
                                  id="prjLicBlacklist"
                                  data=getBlacklistedLicenses
                                  assocData=getWhitelistedLicenses
                                  schema=getModuleLicenseEntrySchema
                                  docId=currentModule._id
                                  collection=getModules
                                  attribute="licenseConfig.blacklist"
                                  readonly=disabled}}
                        </div>
                      {{/if}}
                    {{/with}}
                  </div>
                  <h3>Components</h3>
                  <div class="row">
                    {{#with hasFieldRight 'module.wblist.whitelist_component' currentModule}}
                      {{#if read}}
                        <div class="col-lg-6">
                          {{> componentlist
                                  title="Always allow component"
                                  id="prjCmpWhitelst"
                                  data=getWhitelistedComponents
                                  assocData=getBlacklistedComponents
                                  schema=getModuleComponentEntrySchema
                                  docId=currentModule._id
                                  collection=getModules
                                  attribute="componentConfig.whitelist"
                                  tooltip=getComponentWhitelistTooltip
                                  readonly=disabled
                          }}
                        </div>
                      {{/if}}
                    {{/with}}
                    {{#with hasFieldRight 'module.wblist.blacklist_component' currentModule}}
                      {{#if read}}
                        <div class="col-lg-6">
                          {{> componentlist
                                  title="Always deny component"
                                  id="prjCmpBlacklist"
                                  data=getBlacklistedComponents
                                  assocData=getWhitelistedComponents
                                  schema=getModuleComponentEntrySchema
                                  docId=currentModule._id
                                  collection=getModules
                                  attribute="componentConfig.blacklist"
                                  tooltip=getComponentBlacklistTooltip
                                  readonly=disabled
                          }}
                        </div>
                      {{/if}}
                    {{/with}}
                  </div>
                </div>
              </div>
            {{/if}}
            {{#if hasAccessRight 'module.releases' 'r' currentModule}}
              <div id="releases" class="tab-pane">
                <div class="panel-body">
                  {{#if hasAccessRight 'module.releases.analysis' 'r' currentModule}}
                    <h3>Module analysis</h3>
                    <div class="row">
                      <div class="col-lg-12 ts-stagger-item fadeIn">
                        <table class="table table-striped">
                          <thead>
                          <tr>
                            <th class="col-md-2">Created</th>
                            <th class="col-md-2">Name</th>
                            <th class="col-md-4">Overview</th>
                            {{#if hasAccessRight 'module.releases.analysis' 'd' currentModule}}
                              <th class="col-md-4 text-right">Actions</th>
                            {{/if}}
                          </tr>
                          </thead>
                          <tbody>
                          {{#each moduleAnalysis}}
                            <tr>
                              <td class="col-md-2">{{{dateFromNow date}}}</td>
                              <td class="col-md-2">{{release}}</td>
                              <td class="col-md-4">
                                <div class="ecsbars">
                                  {{> ecsbarLine title="Suitability of licenses" data=licensesChartData }}
                                  {{> ecsbarLine title="Components" data=componentChartData }}
                                </div>
                              </td>
                              {{#if hasAccessRight 'module.releases.analysis' 'd' currentModule}}
                                <td class="col-md-4 text-right">
                                  <a href class="btn btn-danger2 btn-sm delete-analysis">Remove</a>
                                </td>
                              {{/if}}
                            </tr>
                          {{/each}}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  {{/if}}
                  {{#if hasAccessRight 'module.releases.scans' 'r' currentModule}}
                    <h3>Module scans</h3>
                    <div class="row">
                      <div class="col-lg-12 ts-stagger-item fadeIn">
                        {{> reactiveTableServerSide filters=filters sortings=sortings fields=fields method=method options=options}}
                      </div>
                    </div>
                  {{/if}}
                </div>
              </div>
            {{/if}}
            {{#if hasAccessRight 'module.customComponents' 'r' currentModule}}
              {{> moduleSettingsCustomComponents }}
            {{/if}}
            {{#if hasAccessRight 'module.SPDXExportTab' 'r' currentModule}}
              {{> SPDXExportTab }}
            {{/if}}
          {{/unless}}
          {{#if hasAccessRight 'module.danger' 'r' currentModule}}
            <div id="danger" class="tab-pane">                   <!-- Danger -->
              <div class="panel-body violations">
                <div class="row alert alert-warning">
                  <i class="fa fa-bolt"></i> Here starts the Danger Zone
                </div>
                {{#if hasAccessRight 'module.danger.delete' 'x' currentModule}}
                  <div class="panel-body row">
                    <div class="col-xs-10">
                      <p><strong>Archive this module</strong></p>
                      <p>Module will be hidden from the list of active items in project overview</p>
                    </div>
                    <div class="col-xs-2">
                      {{#if (currentModule.archived)}}
                        <button style='min-width: 100px;' class="btn btn-warning pull-right"
                                id="module-unarchive" type='button'>
                          <span class="fa fa-repeat"></span> Unarchived module
                        </button>
                      {{else}}
                        <button style='min-width: 100px;' class="btn btn-warning pull-right"
                                id="module-archive" type='button'>
                          <span class="fa fa-times"></span> Archive module
                        </button>
                      {{/if}}
                    </div>
                  </div>
                {{/if}}
                {{#unless isInfrastructureModule}}
                  {{#if hasAccessRight 'module.danger.delete_history' 'x' currentModule}}
                    <div class="panel-body row">
                      <div class="col-xs-10">
                        <p><strong>Delete the analysis history of this module</strong></p>
                        <p>Once you delete the analysis history, the module needs to be analyzed
                          again.</p>
                      </div>
                      <div class="col-xs-2">
                        <button style='min-width: 100px;' class="btn btn-danger2 pull-right"
                                id="module-delete-analysis" type='button'>
                          <span class="fa fa-trash-o"></span> Delete history
                        </button>
                      </div>
                    </div>
                  {{/if}}
                {{/unless}}
                {{#if hasAccessRight 'module.danger.delete' 'x' currentModule}}
                  <div class="panel-body row">
                    <div class="col-xs-10">
                      <p><strong>Delete this module</strong></p>
                      <p>Once you delete a module, there is no going back. Please be certain.</p>
                    </div>
                    <div class="col-xs-2">
                      <button style='min-width: 100px;' class="btn btn-danger2 pull-right"
                              id="module-delete" type='button'>
                        <span class="fa fa-trash-o"></span> Delete module
                      </button>
                    </div>
                  </div>
                {{/if}}
              </div>
            </div>
          {{/if}}
        </div>
      </form>
    </div>
  </div>
</template>

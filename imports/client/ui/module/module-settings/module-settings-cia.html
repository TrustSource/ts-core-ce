<template name="moduleSettingsCIA">
  <div id="risk" class="tab-pane">
    <div class="panel-body no-bottom-errors">
      <div class="clearfix">
        <div class="pull-right actions actions-wizard" style="position:relative">
          {{#if hasAccessRight 'module.cia.import' 'x' currentModule}}
            {{#if getCIASuggestions.length}}
              <button type="button" class="btn btn-default btn-xs dropdown-toggle"
                      data-toggle="dropdown">
                <span class="fa fa-copy"></span> Import CIA requirements from...<span
                class="caret"></span>
              </button>
              <ul class="dropdown-menu">
                {{#each getCIASuggestions}}
                  <li><a class="copy-cia-settings" id="{{_id}}">{{name}}</a></li>
                {{/each}}
              </ul>
            {{/if}}
          {{/if}}
        </div>
      </div>
      {{#if getProject}}
        {{#if getProjectRequirements}}
          <div class="inner-t-10">
            {{#unless noProjectRequirements}}
              {{> ciaRequirementsDescription requirements=getProjectRequirements projectId=this.projectId}}
            {{else}}
              {{> ciaRequirementsDescription requirements=getProjectRequirements projectId=this.projectId moduleError=true}}
            {{/unless}}
          </div>
        {{/if}}
      {{/if}}
      {{#if hasAccessRight 'module.cia.settings' 'w' currentModule}}
        {{# autoForm
          id="updateModuleFormCIARequirements"
          docId=this._id
          collection=getModules
          schema=getRequirementsSchema
          doc=getRequirements
          type="normal"
        }}
          <h3>CIA requirements</h3>
          <div class="row">
            <div class="col-md-4">
              <div class="row">
                <div class="col-md-12">{{> afQuickField name='CR' }}</div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="row">
                <div class="col-md-12">{{> afQuickField name='IR' }}</div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="row">
                <div class="col-md-12">{{> afQuickField name='AR' }}</div>
              </div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Update</button>
        {{/ autoForm}}
      {{else}}
        {{# autoForm
          id="updateModuleFormCIARequirementsDisplay"
          docId=this._id
          collection=getModules
          schema=getRequirementsSchema
          doc=getRequirements
          type="normal"
        }}
          <h3>CIA requirements</h3>
          <div class="row">
            <div class="col-md-4">
              <div class="row">
                <div class="col-md-12">{{> afQuickField name='CR' disabled=true }}</div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="row">
                <div class="col-md-12">{{> afQuickField name='IR' disabled=true }}</div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="row">
                <div class="col-md-12">{{> afQuickField name='AR' disabled=true }}</div>
              </div>
            </div>
          </div>
        {{/ autoForm}}
      {{/if}}
    </div>
  </div>
</template>

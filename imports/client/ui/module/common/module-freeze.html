<template name="moduleFreeze">
  {{#if isInRole 'compliance_manager,manager' companyId}}
    <!-- Modal: freezeModule -->
    <div class="modal fade" id="freezeModule" tabindex="-1" role="dialog" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="ts-accent-line"></div>
          <div class="modal-header text-center">
            <i class="fa fa-plus ts-big-icon text-success"></i>
            <br/>
            <h4 class="modal-title">Attach a name to the selected analysis</h4>
            <br/>
          </div>
          <form id="freezeModuleForm">
            <div class="modal-body">
              <div class="row">
                <div class="form-group col-xs-12">
                  <label for="moduleRelease">Name</label>
                  <input type="text" value="" id="moduleRelease" maxlength="30"
                         class="form-control" name="moduleRelease">
                  <span class="help-block small">Specify the name for analysis. Limited to 30 characters </span>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
              <button type="submit" class="btn btn-primary">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  {{/if}}
</template>

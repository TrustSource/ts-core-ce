<template name="moduleDependencies">
  {{#if _id}}
    {{#unless isInfrastructureModule}}
      <div class="clearfix ecs-dependencies-box">
        {{#unless isListSubView}}
          <div class="ts-panel ecs-components ecs-dependencies-with-details {{#if currentComponent}}ecs-dependencies-with-active-component{{/if}}">
            <div class="panel-heading module-deps-heading">
              <div class="module-deps-heading-left">
                <div class="input-group input-group-sm module-deps-search">
                  <span class="input-group-addon"><i class="fa fa-filter"></i></span>
                  <input type="text" name="search" class="form-control" value="{{session 'moduleDetailListFilter'}}"
                         placeholder="Filter">
                </div>
                <button class="btn btn-default btn-sm sorting" title="Sort order">
                  {{#if isDescSorting}}
                    <i class="fa fa-sort-alpha-desc"></i>
                  {{else}}
                    <i class="fa fa-sort-alpha-asc"></i>
                  {{/if}}
                </button>
              </div>
              <span>Dependencies</span>
            </div>
            {{#unless isExtView}}
              <div class="intro-dependency-filters">
                {{>moduleListFilter options=moduleListFilterOptions}}
              </div>
              <div class="ecs-dependencies intro-dependency-components">
                {{#each getComponents.filtered}}
                  {{> moduleDependency}}
                {{/each}}
                {{#if requestInProgress}}
                  {{#panel}}
                    <div class="text-primary">
                      <i class="fa fa-spinner fa-spin"></i> Loading data for module, please wait...
                    </div>
                  {{/panel}}
                {{else}}
                  {{#unless getComponents.filtered}}
                    {{> reactiveTableNoData}}
                  {{/unless}}
                {{/if}}
              </div>
              <div class="intro-dependency-pages">
                {{> paginationList collection=getComponents.all list=getComponents.filtered}}
              </div>
            {{else}}
              {{#if isGraphView}}
                {{> moduleGraphs collection=getComponents.all}}
              {{else}}
                {{#if isTreeView}}
                  {{> moduleTree collection=getComponents.all}}
                {{/if}}
              {{/if}}
            {{/unless}}
          </div>
        {{else}}
          {{#if isTestsView}}
            {{> moduleTests collection=getComponents.all}}
          {{/if}}
        {{/unless}}
        {{#unless isListSubView}}
          {{#if currentComponent}}
            {{> moduleDependenciesAside componentKey=currentComponent components=getComponents.all}}
          {{/if}}
        {{/unless}}
      </div>
    {{else}}
      {{#if currentComponent}}
        <div class="ecs-dependencies-box ic-details clearfix">
          {{> moduleDependenciesAside componentKey=currentComponent components=getComponents.all isInfrastructureModule=true}}
        </div>
      {{else}}
        <div class="ts-panel ecs-components">
          <div class="alert alert-info">
            <p>
              <strong>Sorry, detailed information not available yet. </strong><br>
              Component has been scheduled for autoscan and
              information will be provided soon. In case you need information urgently,
              please <a href="{{app 'supportUrl'}}" target="_blank" rel="noopener noreferrer" class="highlight">report an issue</a>.
              Thank you for your patience.
            </p>
          </div>
        </div>
      {{/if}}
    {{/unless}}
  {{/if}}
</template>

<template name="moduleDependenciesChart">
  <div class="ecsbars">
    <div class="row">
      {{#with statistics}}
        <div class="col-md-6 col-sm-3">
          {{#if overall}}
            {{> ecsbarLine title="Components" data=overall }}
          {{else}}
            <div class="row">
              <div class="col-sm-12 text-center ecs-bar-title">
                <span class="font-bold">Components</span>
              </div>
              <div class="col-sm-12">
                <a href class="relative block">
                  <div class="progress m-t-xs full progress-large">
                    <div style="width: 100%"
                         aria-valuemax="100" aria-valuemin="0" aria-valuenow="100"
                         role="progressbar" class="progress-bar progress-bar-disabled"
                         data-toggle="tooltip"
                         title="disabled" data-original-title="disabled">
                    </div>
                  </div>
                  <small class="disable-notification-compact disabled disable-notification">
                    analysis required
                  </small>
                </a>
              </div>
            </div>
          {{/if}}
        </div>
        <div class="col-md-6 col-sm-3">
          {{> ecsbarLine title="Vulnerabilities" data=vulnerability }}
        </div>
        <div class="col-md-6 col-sm-3">
          {{> ecsbarLine title="Legal" data=legal }}
        </div>
        <div class="col-md-6 col-sm-3">
          {{#unless isVersioningDisabled}}
            {{> ecsbarLine title="Versioning" data=versioning}}
          {{else}}
            <div class="row">
              <div class="col-sm-12 text-center ecs-bar-title">
                <span class="font-bold">Versioning</span>
              </div>
              <div class="col-sm-12">
                <a href="{{pathFor route='moduleSettings' data=getModuleOptions}}" class="relative block">
                  <div class="progress m-t-xs full progress-large">
                    <div style="width: 100%"
                         aria-valuemax="100" aria-valuemin="0" aria-valuenow="100"
                         role="progressbar" class="progress-bar progress-bar-disabled"
                         data-toggle="tooltip"
                         title="disabled" data-original-title="disabled">
                    </div>
                  </div>
                  <small class="disable-notification-compact disabled disable-notification">
                    disabled
                  </small>
                </a>
              </div>
            </div>
          {{/unless}}
        </div>
      {{/with}}
    </div>
  </div>
</template>

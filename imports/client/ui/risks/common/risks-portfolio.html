<template name="risksPortfolio">
  <div class="row pinner-b-20i">
    <div class="col-md-12 pinner-b-20i">
      <h3 class="h3 inner-t-0">Portfolio overview</h3>
      <div class="pull-left">
        {{#if isProjectSpecific}}
          <button class="btn btn-default reset-project">
            <span class="fa fa-chevron-left inner-r-5"></span>
            <span>{{__ 'BackToAll'}}</span>
          </button>
          <h4 class="inline-block m-l-md m-t-sm m-b-none portfolio-title truncate" title="{{getProjectSpecificName}}">
            <span class="fa fa-th-large"></span> {{getProjectSpecificName}}
          </h4>
        {{/if}}
      </div>
      <div class="pull-right form-horizontal form-inline inner-b-5">
        <select class="form-control form-control-sm change-view">
          <option value="" disabled="disabled" label="{{__ 'ViewType'}}">{{__ 'ViewType'}}</option>
          <option value="risks-state" label="Risks - State">Risks - State</option>
          <option value="risks-impact" label="Risks - Impact">Risks - Impact</option>
        </select>
      </div>
      <div class="portfolio-chart clearfix pinner-b-20i" style="margin-bottom: 10px; height: 400px">
        <canvas id="portfolio-chart" height="150"></canvas>
      </div>
    </div>
  </div>
</template>

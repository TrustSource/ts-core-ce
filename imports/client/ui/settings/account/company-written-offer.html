<template name="companyWrittenOffer">
  {{#panel title="Written Offer"}}
    <form class="form-horizontal written_offer">
      <div class="form-group">
        <label class="col-sm-2 control-label" for="writtenOffer">Title</label>
        <div class="col-sm-10 controls">
          <input type="text" value="{{writtenOfferTitle}}" name="writtenOfferTitle" id="writtenOfferTitle" class="form-control">
        </div>
      </div>
      <div class="form-group">
        <label class="col-sm-2 control-label" for="writtenOffer">Details</label>
        <div class="col-sm-10 controls">
          <textarea value="{{writtenOfferDescription}}" name="writtenOfferDescription" id="writtenOfferDescription" class="form-control" rows="12"></textarea>
        </div>
      </div>
      <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
          <button type="submit" class="btn btn-sm btn-primary">
            Update
          </button>
          <button type="button" class="btn btn-sm btn-primary reset_written_offer">
            Reset
          </button>
        </div>
      </div>
    </form>
  {{/panel}}
</template>

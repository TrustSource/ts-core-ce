<template name="companyIntegrationsJira">
  {{#pageHeader}}
    <div class="settings-header">
      <div class="settings-header-left">
        <h2 class="font-light m-b-xs">Jira</h2>
        <small>Configure Jira integration settings</small>
      </div>
    </div>
  {{/pageHeader}}
  <div class="content">
    <div class="panel">
      <div class="panel-body">
        <form class="form-horizontal jira" autocomplete="off">
          <div class="form-group">
            <div class="col-sm-8 col-sm-offset-2">
              <div class="checkbox" style="display: inline-block!important; margin-bottom: 5px!important;">
                <span class="ios-toggle-label ios-toggle-label-md ios-toggle-label-dark">API</span>
                <label style="padding-left: 0px;">
                  <input type="checkbox" checked="{{isType 'email'}}" id="jira-type" name="jira-type"
                         value="true" class="ios-toggle always-on">
                  <span class="checkbox-label checkbox-label-md" data-off="" data-on=""></span>
                </label>
                <span class="ios-toggle-label ios-toggle-label-md ios-toggle-label-dark">Email</span>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-2 control-label" for="jira-key">Project key:</label>
            <div class="col-sm-4 controls">
              <input type="text" autocomplete="off" id="jira-key" name="jira-key" value="{{jira.key}}"
                     placeholder="Project key" class="form-control"/>
            </div>
          </div>
          {{#unless isType 'email'}}
            <div class="form-group">
              <label class="col-sm-2 control-label" for="jira-url">Company url:</label>
              <div class="col-sm-4 controls">
                <input type="text" autocomplete="off" id="jira-url" name="jira-url" value="{{jira.url}}"
                       placeholder="Company url" class="form-control"/>
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-2 control-label" for="jira-user">User:</label>
              <div class="col-sm-4 controls">
                <input type="text" autocomplete="off" id="jira-user" name="jira-user" value="{{jira.user}}"
                       placeholder="User" class="form-control"/>
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-2 control-label" for="jira-passwd">Password:</label>
              <div class="col-sm-4 controls">
                <input type="password" autocomplete="off" id="jira-passwd" name="jira-passwd"
                       placeholder="Leave blank to keep current" class="form-control"/>
              </div>
            </div>
          {{else}}
            <div class="form-group">
              <label class="col-sm-2 control-label" for="jira-url">Email address:</label>
              <div class="col-sm-4 controls">
                <input type="text" autocomplete="off" id="jira-email" name="jira-email" value="{{jira.email}}"
                       placeholder="Receiver email address" class="form-control"/>
              </div>
            </div>
          {{/unless}}
          <div class="form-group">
            <label class="col-sm-2 control-label" for="jira-active">Active:</label>
            <div class="col-sm-4 pinner-t-4">
              <input type="checkbox" id="jira-active" name="jira-active" value="true" checked="{{jira.active}}"
                     placeholder="Active" class="i-checks"/>
            </div>
          </div>
          <div class="form-group">
            <div class="col-sm-offset-2 col-sm-4">
              <button type="submit" class="btn  btn-sm btn-primary update">
                Update
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

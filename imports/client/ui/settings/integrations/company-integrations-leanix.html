<template name="companyIntegrationsLeanix">
  {{#pageHeader}}
    <div class="settings-header">
      <div class="settings-header-left">
        <h2 class="font-light m-b-xs">LeanIX</h2>
        <small>Configure LeanIX integration settings</small>
      </div>
    </div>
  {{/pageHeader}}
  <div class="content">
    <div class="panel">
      <div class="panel-body">
        <form class="form-horizontal leanix" autocomplete="off">
          <div class="form-group">
            <label class="col-sm-2 control-label" for="companyName">Company name:</label>
            <div class="col-sm-4 controls">
              <input type="text" name="companyName" value="{{leanix.companyName}}"
                     placeholder="company name" class="form-control" autocomplete="off"/>
            </div>
          </div>

          <!--<div class="form-group" {{errorClass 'url'}}>-->
          <!--<label class="col-sm-2 control-label" for="workspace">Workspace ID:</label>-->
          <!--<div class="col-sm-4 controls">-->
          <!--<input type="text" name="workspace" value="{{leanix.workspace}}" placeholder="workspace id" class="form-control"/>-->
          <!--<span class="help-block">{{errorMessage 'company'}}</span>-->
          <!--</div>-->
          <!--</div>-->

          <!--<div class="form-group" {{errorClass 'url'}}>-->
          <!--<label class="col-sm-2 control-label" for="user">User ID:</label>-->
          <!--<div class="col-sm-4 controls">-->
          <!--<input type="text" name="user" value="{{leanix.user}}" placeholder="user id" class="form-control"/>-->
          <!--<span class="help-block">{{errorMessage 'company'}}</span>-->
          <!--</div>-->
          <!--</div>-->

          <div class="form-group">
            <label class="col-sm-2 control-label" for="token">API-Token:</label>
            <div class="col-sm-4 controls">
              <input type="password" name="token" placeholder="Leave blank to keep current"
                     class="form-control" autocomplete="off"/>
            </div>
          </div>

          <div class="form-group">
            <div class="col-sm-offset-2 col-sm-4">
              <button type="submit" class="btn  btn-sm btn-primary update">
                Update
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

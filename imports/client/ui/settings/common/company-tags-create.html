<template name='companyTagsCreate'>
  <a class="btn btn-primary btn-xs" data-toggle="modal" data-target="#createTag" title="Add new tag">
    <span class="fa fa-tags" aria-hidden="true"></span> Add new tag</a>
  <!-- Modal: createTag -->
  <div class="modal fade" id="createTag" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-md">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <i class="fa fa-tags ts-big-icon text-success"></i>
          <br/>
          <h4 class="modal-title">Add tag</h4>
        </div>
        <form id="addTagForm">
          <div class="modal-body">
            <div class="row">
              <div class="form-group col-xs-12">
                <label for="tagName">Name</label>
                <input type="text"  id="tagName" name="tagName" class="form-control"
                       placeholder="Enter name of tag">
                <span class="help-block small">Allowed only a-z (small English letters), 0-9 (numbers), : (colon) and - (minus symbol)</span>
              </div>
              <div class="form-group col-xs-12">
                <label for="tagDescription">Description</label>
                <textarea id="tagDescription" name="tagDescription" class="form-control"
                          placeholder="Enter description of tag" rows="2"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close
            </button>
            <button type="submit" class="btn btn-primary">Add tag</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

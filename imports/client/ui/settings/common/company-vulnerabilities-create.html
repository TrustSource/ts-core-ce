<template name='companyManualVulnerabilitiesCreate'>
  <a class="btn btn-primary btn-xs" data-toggle="modal" data-target="#createManualVulnerability" title="Add new vulnerability">
    <span class="fa fa-shield-halved" aria-hidden="true"></span> Add vuln.</a>
  <!-- Modal: createManualVulnerability -->
  <div class="modal fade" id="createManualVulnerability" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <i class="fa fa-shield-halved ts-big-icon text-success"></i>
          <br/>
          <h4 class="modal-title">Add manual vulnerability</h4>
          <br/>
          <div class="{{createModuleMsgType}}"
               id="form-messages">{{createModuleMsg}}</div>
        </div>
        <form id="addVulnerabilityForm">
          <div class="modal-body">
            <div class="row">
              {{#unless hasVersion}}
                <div class="form-group col-xs-12">
                  {{> componentVersionSelector}}
                </div>
              {{else}}
                {{#with customComponent}}
                  <div class="col-xs-12">
                    <div class="panel panel-success" style="padding: 10px 20px">
                      <div class="row">
                        <div class="col-xs-7">
                          <div class="row">
                            <div class="col-xs-6 truncate" title="{{name}}">
                              <a href="{{pathFor 'componentDetail'}}" target="_blank"><strong>{{name}}</strong></a>
                            </div>
                            <div class="col-xs-3">{{{getPkgMgrIcon key}}}</div>
                            <div class="col-xs-3">
                              {{#if homepageUrl}}
                                <a href="{{homepageUrl}}" target="_blank" title="goto homepage"><i
                                    class="fa fa-fw fa-external-link"></i></a>
                              {{else}}
                                &nbsp;
                              {{/if}}
                              &nbsp;
                              {{#if repoUrl}}
                                <a href="{{repoUrl}}" target="_blank" title="goto repository"><i
                                    class="fa fa-fw fa-code-fork"></i></a>
                              {{else}}
                                &nbsp;
                              {{/if}}
                            </div>
                          </div>
                        </div>
                        <div class="col-xs-5">
                          {{#with versions}}
                            <div class="col-md-12" style="margin-bottom: 3px">
                              <div class="pull-left text-right">
                                {{this}}
                              </div>
                            </div>
                          {{/with}}
                        </div>
                      </div>
                    </div>
                  </div>
                {{/with}}
              {{/unless}}
              <div class="form-group col-xs-6">
                <label for="vulnerabilityKey">Vulnerability key *</label>
                <input type="text"  id="vulnerabilityKey" name="vulnerabilityKey" class="form-control"
                       placeholder="Enter vulnerability key identifier">
              </div>
              <div class="form-group col-xs-6">
                <label for="vulnerabilityLink">Vulnerability link</label>
                <input type="text"  id="vulnerabilityLink" name="vulnerabilityLink" class="form-control"
                       placeholder="Enter vulnerability link">
              </div>
              <div class="form-group col-xs-6">
                <label for="vulnerabilitySeverity">Severity</label>
                <select id="vulnerabilitySeverity" name="vulnerabilitySeverity" class="form-control">
                  <option value="critical">Critical</option>
                  <option value="high">High</option>
                  <option value="moderate">Moderate</option>
                  <option value="low">Low</option>
                </select>
              </div>
              <div class="form-group col-xs-6">
                <label for="vulnerabilityScore">Score</label>
                <input type="number" min="1" max="10"  id="vulnerabilityScore" name="vulnerabilityScore" class="form-control"
                       placeholder="Vulnerability score (1..10)">
              </div>
              <div class="form-group col-xs-12">
                <label for="vulnerabilityDescription">Vulnerability description</label>
                <textarea id="vulnerabilityDescription" name="vulnerabilityDescription" class="form-control"
                          placeholder="Enter vulnerability description" rows="2"></textarea>
                <span class="help-block small">Specify notice, details and resolution of vulnerability</span>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close
            </button>
            <button type="submit" class="btn btn-primary">Add vulnerability</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

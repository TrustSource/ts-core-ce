<template name='companyWebhooksCreate'>
  <a class="btn btn-primary {{size}}" data-toggle="modal" data-target="#createWebhook" title="Add new webhook">
    <span class="fa fa-tower-broadcast" aria-hidden="true"></span> Add webhook/channel</a>
  <!-- Modal: createWebhook -->
  <div class="modal fade" id="createWebhook" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <i class="fa fa-tower-broadcast ts-big-icon text-success"></i>
          <br/>
          <h4 class="modal-title">Add webhook/channel</h4>
          <br/>
          <div class="{{createModuleMsgType}}"
               id="form-messages">{{createModuleMsg}}</div>
        </div>
        <form id="addWebhookForm">
          <div class="modal-body">
            <div class="row">
              <div class="form-group col-xs-6">
                <label for="webhookName">Name *</label>
                <input type="text"  id="webhookName" name="webhookName" class="form-control"
                       placeholder="Enter webhook name">
              </div>
              <div class="form-group col-xs-6">
                <label for="webhookTrigger">Trigger *</label>
                <select id="webhookTrigger" name="webhookTrigger" multiple class="form-control select2">
                  {{#each webhookTriggerOptions}}
                    <option value="{{value}}">{{label}}</option>
                  {{/each}}
                </select>
              </div>
              <div class="form-group col-xs-12">
                <label for="webhookType">Type *</label>
                <select id="webhookType" name="webhookType" class="form-control select2">
                  {{#each webhookTypeOptions}}
                    <option value="{{value}}" {{disabledAttr}}>{{label}}</option>
                  {{/each}}
                </select>
              </div>
              {{#if webhookTypeWebhook}}
                <div class="form-group col-xs-6">
                  <label for="webhookMethod">Method *</label>
                  <select id="webhookMethod" name="webhookMethod" class="form-control select2">
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="PATCH">PATCH</option>
                    <option value="DELETE">DELETE</option>
                    <option value="GET">GET</option>
                  </select>
                </div>
                <div class="form-group col-xs-6">
                  <label for="webhookUrl">Url *</label>
                  <input type="url" id="webhookUrl" name="webhookUrl" class="form-control"
                         placeholder="Target service url">
                </div>
                <div class="form-group col-xs-12">
                  <label for="webhookHeaders">Headers</label>
                  <textarea id="webhookHeaders" name="webhookHeaders" class="form-control"
                            placeholder="List of headers" rows="2"></textarea>
                  <span class="help-block small">Key and values are separated by <b>:</b> Rows are separated by <b>;</b> </span>
                </div>
                <div class="form-group col-xs-12">
                  <span class="help-block small">
                    Every delivery is signed: <b>X-TrustSource-Signature</b> is <code>sha256=</code> and the hex
                    HMAC-SHA256 of <code>&lt;X-TrustSource-Timestamp&gt;.&lt;body&gt;</code> with the webhook's
                    signing secret, which you can copy from the list after saving.
                  </span>
                </div>
              {{/if}}
              {{#if webhookTypeTeams}}
                <div class="form-group col-xs-12">
                  <label for="webhookUrl">"Incoming Webhook" url *</label>
                  <input type="url" id="webhookUrl" name="webhookUrl" class="form-control"
                         placeholder="Connectors > Incoming Webhook > Url">
                </div>
              {{/if}}
              {{#if webhookTypeTeamsWorkflow}}
                <div class="form-group col-xs-12">
                  <label for="webhookUrl">"Workflow" url *</label>
                  <input type="url" id="webhookUrl" name="webhookUrl" class="form-control"
                         placeholder="Workflows > Post to a channel when a webhook request is received > Url">
                </div>
              {{/if}}
              {{#if webhookTypeSlack}}
                <div class="form-group col-xs-12">
                  <label for="webhookUrl">"Incoming Webhook" url *</label>
                  <input type="url" id="webhookUrl" name="webhookUrl" class="form-control"
                         placeholder="Integration > Apps > Incoming Webhook > Webhook URL">
                </div>
              {{/if}}
              {{#if webhookTypeGitter}}
                <div class="form-group col-xs-12 inner-b-10">
                  <div class="alert alert-info">
                    <p><i class="fa fa-info-circle"></i> <strong>Under development</strong></p>
                  </div>
                </div>
              {{/if}}
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close
            </button>
            <button type="submit" class="btn btn-primary">Add webhook</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

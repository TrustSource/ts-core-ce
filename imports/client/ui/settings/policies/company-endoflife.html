<template name="companyEndoflife">
  {{#pageHeader}}
    <div class="settings-header">
      <div class="settings-header-left">
        <h2 class="font-light m-b-xs">Component end-of-life</h2>
        <small>Configure an end-of-life policy for your company</small>
      </div>
    </div>
  {{/pageHeader}}
  <div class="content">
    {{#if isInRole (settingsRoles 'endoflifePolicy') companyId}}
      <div class="ts-panel no-bottom-errors clearfix">
        <div class="panel-body">
          {{> crawlerDataNotice check='endoflife'}}
          {{#unless endoflifePolicy}}
              {{> reactiveTableNoData}}
          {{/unless}}
          <div class="inner-lr-40">
            <div class="row">
              <div class="col-lg-12">
                <div class="checkbox">
                  <label>
                    <input type="checkbox" checked="{{endoflifePolicy.enabled}}" name="endoflifeConfigEnabled"
                           value="true" id="companyEndoflifeConfigEnabled" class="ios-toggle" disabled={{disabled}}>
                    <span for="companyEndoflifeConfigEnabled" class="checkbox-label" data-off="off" data-on="on"></span>
                    <span style="display: inline-block;margin: 9px 0 0 30px;float: left;">Enable end-of-life analysis for all modules</span>
                  </label>
                </div>
              </div>
            </div>
            {{#if endoflifePolicy.enabled}}
              {{# autoForm
                id="updateCompanyFormEndoflifeConfig"
                docId=this._id
                collection=getCompanies
                schema=getEndoflifeSchema
                doc=endoflifePolicy
                type="normal"
              }}
                <h3>End-of-life thresholds</h3>
                <div class="row inner-b-50">
                  <div class="col-md-5">
                    {{> afQuickField name='warningThreshold' disabled=disabled}}
                  </div>
                  <div
                    class="col-md-5 col-md-offset-1">
                    {{> afQuickField name='violationThreshold' disabled=disabled}}
                  </div>
                </div>
                <div class="row">
                  <div class="col-xs-12">
                    <button type="submit" class="btn btn-primary">Update</button>
                    <span class="text-danger m-l-sm">
                      {{#if afFieldIsInvalid name='warningThreshold'}}
                        {{afFieldMessage name='warningThreshold'}}
                      {{/if}}
                    </span>
                  </div>
                </div>
              {{/ autoForm}}
            {{/if}}
          </div>
        </div>
      </div>
    {{/if}}
  </div>
</template>

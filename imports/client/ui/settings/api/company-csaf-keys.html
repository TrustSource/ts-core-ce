<template name="companyCsafKeys">
  {{#panel}}
    <div class="reactive-table-options clearfix">
      <div class="reactive-table-filter">
        <div class="input-group">
          <span class="input-group-addon"><i class="fa fa-filter"></i></span>
          <input class="reactive-table-input form-control csaf-filter-input" type="text" placeholder="Filter">
        </div>
      </div>
    </div>
    <table class="table">
      <thead>
        <tr>
          <th>Created</th>
          <th>Key</th>
          <th>Name</th>
          <th>TLP levels</th>
          <th>Operations</th>
          <th>Requests</th>
          <th>Status</th>
          <th class="text-right"></th>
        </tr>
      </thead>
      <tbody>
        {{#each getCsafKeys}}
          <tr>
            <td>{{formatCreated this.created}}</td>
            <td>
              <span class="form-control-static">{{this.maskedKey}}</span>
            </td>
            <td>{{this.name}}</td>
            <td>
              {{#each this.tlpLevels}}
                <span class="label label-info inner-r-5">{{this}}</span>
              {{/each}}
            </td>
            <td>
              {{#each this.operations}}
                <span class="label label-default inner-r-5">{{opLabel this}}</span>
              {{/each}}
            </td>
            <td><span class="label label-success">{{requestCount this}}</span></td>
            <td>
              {{#if this.isPublished}}
                <span class="label label-primary">Published</span>
              {{else}}
                <span class="label label-default">Unpublished</span>
              {{/if}}
            </td>
            <td class="text-right">
              <button class="btn btn-info btn-sm copy-csaf-key inner-r-5" type="button" title="Copy full key">
                <span class="fa fa-clipboard"></span>
              </button>
              {{#if this.isPublished}}
                <button class="btn btn-warning btn-sm unpublish-csaf-key" type="button">
                  <span class="fa fa-lock"></span> Unpublish
                </button>
              {{else}}
                <button class="btn btn-primary btn-sm publish-csaf-key" type="button">
                  <span class="fa fa-unlock"></span> Publish
                </button>
                <button class="btn btn-danger2 btn-sm delete-csaf-key" type="button">
                  <span class="fa fa-trash-o"></span> Delete
                </button>
              {{/if}}
            </td>
          </tr>
        {{else}}
          <tr><td colspan="8">{{> reactiveTableNoData}}</td></tr>
        {{/each}}
      </tbody>
    </table>

    <!-- Modal: create -->
    <div class="modal fade" id="createCsafKey" role="dialog" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="ts-accent-line"></div>
          <div class="modal-header text-center">
            <i class="fa fa-key ts-big-icon text-success"></i><br/>
            <h4 class="modal-title">Create CSAF feed key</h4>
          </div>
          <form id="createCsafKeyForm">
            <div class="modal-body">
              <div class="form-group">
                <label for="csafKeyName">Name</label>
                <input type="text" id="csafKeyName" name="csafKeyName" class="form-control" placeholder="e.g. Partner ACME">
              </div>
              <div class="form-group">
                <label>TLP levels <span class="text-danger">*</span></label>
                <div>
                  {{#each tlpLevelOptions}}
                    <label class="checkbox-inline">
                      <input type="checkbox" class="new-csaf-tlp" name="newCsafTlp" value="{{this}}"> {{this}}
                    </label>
                  {{/each}}
                </div>
                <span class="help-block small">Select at least one level this key may read.</span>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Create</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  {{/panel}}
</template>

<template name='companyLicenseLists'>
  {{#pageHeader}}
    <div class="settings-header">
      <div class="settings-header-left">
        <h2 class="font-light m-b-xs">License allow/deny</h2>
        <small>Configure company license allow/deny lists</small>
      </div>
    </div>
  {{/pageHeader}}
  <div class="content">
    <div class="ts-panel">
      <div class="panel-body">
        <div class="row">
          <div class="col-lg-12">
            <div class="checkbox">
              <label>
                <input type="checkbox" checked="{{getUserCompany.requireWhitelist}}" name="requireWhitelist"
                   value="true" id="companyRequireWhitelist" class="ios-toggle {{cantEditRequireWhitelist}}">
                <span for="companyRequireWhitelist" class="checkbox-label" data-off="off" data-on="on"></span>
                <span style="display: inline-block;margin: 9px 0 0 30px;float: left;">Enforce allow (all licenses not explicitly on the allow
                      will be marked as violation 'not allowed')</span>
              </label>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-6">
            {{> moduleLicenseList
                title="Always allow license"
                id="userLicWhitelst"
                data=getWhitelistedLicenses
                assocData=getBlacklistedLicenses
                schema=getCompanyLicenseEntrySchema
                docId=this._id
                collection=getCompany
                attribute="licenseConfig.whitelist"
            }}
          </div>
          <div class="col-lg-6">
            {{> moduleLicenseList
                title="Always deny license"
                id="userLicBlacklist"
                data=getBlacklistedLicenses
                assocData=getWhitelistedLicenses
                schema=getCompanyLicenseEntrySchema
                docId=this._id
                collection=getCompany
                attribute="licenseConfig.blacklist"
            }}
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

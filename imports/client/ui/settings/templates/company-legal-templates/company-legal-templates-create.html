<template name="companyLegalTemplatesCreate">
  {{#if isInRole (settingsRoles 'legalTemplates') companyId}}
    <a href="#" class="btn btn-primary btn-xs showCreateTemplate">
      <span class="fa fa-plus-circle" aria-hidden="true"></span> Create template</a>

    <!-- Modal: createRule -->
    <div class="modal fade" id="createTemplate" tabindex="-1" role="dialog" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="ts-accent-line"></div>
          <div class="modal-header text-center">
            <i class="fa fa-file-contract ts-big-icon text-success"></i>
            <br/>
            <h4 class="modal-title">Create template</h4>
            <br/>
            <br/>
            <div class="{{createTemplateMsgType}}"
                 id="form-messages">{{createTemplateMsg}}</div>
          </div>
          <form id="createTemplateForm">
            <div class="modal-body">
              <div class="row">
                <div class="form-group col-xs-12">
                  <label for="templateName">Name*</label>
                  <input type="text" value="" id="templateName" class="form-control"
                         name="templateName">
                </div>
                <div class="form-group col-xs-12">
                  <label for="templateType">Type*</label>
                  <select id="templateType" class="form-control" name="templateType">
                    <option value="" selected disabled hidden>Select type</option>
                    <option value="project">Project</option>
                    <option value="module">Module</option>
                  </select>
                </div>
                <div class="form-group col-xs-12">
                  <label for="templateOrder">Order</label>
                  <input type="text" value="" id="templateOrder" class="form-control"
                         name="templateOrder">
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-default" data-dismiss="modal">Close
              </button>
              <button type="submit" class="btn btn-primary">Create Rule</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  {{/if}}
</template>

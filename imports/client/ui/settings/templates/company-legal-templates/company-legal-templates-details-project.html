<template name="companyLegalTemplatesDetailsProject">
  <div class="clearfix">
    <div class="pull-right actions actions-wizard" style="position:relative">
      <a href class="btn btn-default btn-xs view-wizard {{wizardBtnClass true}}">
        <span class="fa fa-magic"></span> Start wizard
      </a>
      <a href class="btn btn-default btn-xs view-all {{wizardBtnClass }}">
        <span class="fa fa-list"></span> View all
      </a>
    </div>
  </div>
  {{#if wizardView}}
    <h3>Legal settings wizard</h3>
    {{> wizard id="legalWizard" steps=stepsQuestionnaire clearOnDestroy=true nextButton='Next' backButton='Back'
        confirmButton='Finish' stepsTemplate='questionnaireSteps'}}
  {{else}}
    {{# autoForm
        id="updateFormCompanyProjectTemplateRequirements"
        docId=this._id
        collection=getProjects
        schema=getRequirementsSchema
        doc=getRequirements
        type="normal"
    }}
      <div class="row">
        <div class="col-md-6">
          <h3>Commercial Aspects</h3>
          <div class="row">
            <div class="col-md-12">{{> afQuickField name='CA'}}</div>
            <div class="col-md-12 inner-b-20">
              <i>
                If you are not sure, which one to choose, select <strong>usage fee</strong>. This will be the most restrictive, but you may be sure to be on the safe side.
              </i>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <h3>Operating Model</h3>
          <div class="row">
            <div class="col-md-12">{{> afQuickField name='OM'}}</div>
            <div class="col-md-12 inner-b-20">
              <i>
                If you are not sure, which model to choose, we recommend to select the <strong>embedded model</strong>, as it will be the most restrictive option. This will give you less options but puts you on the safe side.
              </i>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
          <h3>Intellectual Property Aspects</h3>
          <div class="row">
            <div class="col-md-6">
              <div class="row">
                <div class="col-md-12">{{> afQuickField name='IP_protect'}}</div>
                <div class="col-md-12 inner-b-20">
                  <i>
                    Some licenses come without explicit grants from all contributors, thus the license grants you a usage right but does not protect from additional claims from contributors. If you <strong>switch on</strong> this protection, it will flag corresponding licenses as violations
                  </i>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="row">
                <div class="col-md-12">{{> afQuickField name='IP_enforce'}}</div>
                <div class="col-md-12 inner-b-20">
                  <i>
                    Some licenses will terminate their grants in case you are seeking to defend your rights in front of a court. If such a situation seems likely to you, e.g. customer overusing purchased sets but not willing to pay their bill, you might consider to <strong>activate</strong> Outbound protection. It will flag all licenses terminating when seeking to defend your rights as violations.
                  </i>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Update legal requirements</button>
    {{/ autoForm}}
  {{/if}}
</template>

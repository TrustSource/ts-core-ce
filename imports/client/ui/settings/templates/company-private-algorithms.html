<template name="companyPrivateAlgorithms">
  {{#pageHeader}}
    <div class="settings-header">
      <div class="settings-header-left">
        <h2 class="font-light m-b-xs">Private Algorithms</h2>
        <small>Configure Private Algorithms for your company</small>
      </div>
    </div>
  {{/pageHeader}}
  <div class="content">
    {{#if isInRole (settingsRoles 'privateAlgorithms') companyId}}
      {{#panel title="Private Algorithms"}}
        <div class="form-horizontal">
          {{#each getPrivateAlgorithms}}
            <div class="form-group">

              <label class="col-sm-1 control-label">Algorithm&nbsp;{{this.index}}:</label>

              <div class="col-sm-3 controls">
                <p class="form-control-static">{{this.key}} [{{this.strength}}]</p>
              </div>
              <div class="col-sm-8 controls">
                <button class="btn btn-info btn-sm copy-algorithm-key inner-r-10" type="button" data-clipboard-text="{{this.key}}">
                  <span class="fa fa-clipboard"></span>
                </button>
                <button class="btn btn-danger2 btn-sm delete-algorithm inner-r-10" type="button">
                  <span class="fa fa-trash-o"></span>
                  Delete
                </button>
                {{#if this.author}}
                  <div class="label label-default label-lg">Created {{getTime this.created}} by {{this.author}}</div>
                {{/if}}
              </div>
            </div>
          {{/each}}
          <div class="form-group">
            <form id="addPrivateAlgorithmForm">
              <div class="col-sm-offset-1 col-sm-5">
                <div class="row">
                  <div class="col-xs-6">
                    <input class="form-control" name="newPrivateName" id="newPrivateName" placeholder="Name">
                  </div>
                  <div class="col-xs-4">
                    <input class="form-control" type="number" name="newPrivateStrength" id="newPrivateStrength" placeholder="Strength">
                  </div>
                  <div class="col-xs-2">
                    <button class="btn btn-primary create-algorithm" type="submit">Create New</button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      {{/panel}}
    {{/if}}
  </div>
</template>

<template name="companyTagsImport">
  {{#panel title="Import tags from CSV"}}
    <form class="form-horizontal invite" id="importTags">
      <div class="form-group">
        <label class="col-sm-2 control-label" for="uploadCSV">File*</label>
        <div class="col-sm-4">
          <div class="input-group input-group-file">
            <span class="input-group-btn">
              <span class="btn btn-default btn-file">
                Browse...
                <input type="file" name="uploadCSV" id="uploadCSV" accept=".csv">
              </span>
            </span>
            <input type="text" name="filename" readonly="readonly" placeholder="Import file" class="form-control">
          </div>
          <span class="help-block small">
            Select file (csv and less 1mb) from your device
            <a href="/sample_tag_import.csv" class="highlight" target="_blank">(see sample)</a>
          </span>
          <div class="controls">
            <button class="btn btn-primary process-import" type="button" disabled="{{#unless importExpected}}true{{/unless}}"><i class="fa fa-play"></i> {{#unless importExpected}}Try importing CSV{{else}}Import CSV{{/unless}}</button>
            <button class="btn btn-danger2 clear-import" type="button" disabled="{{#unless importResults}}true{{/unless}}"><i class="fa fa-trash"></i> Clear results</button>
          </div>
        </div>
        <div class="col-sm-6">
          <h6><b>Please make sure that the structure of your CSV complies with the following rules</b></h6>
          <ul class="small_list clearfix">
            <li>be a valid CSV-file</li>
            <li>not be bigger than 1MB</li>
            <li>contain the column names in the first line with correct format</li>
            <li>values have to be separated by semicolon</li>
            <li>allowed only a-z (small English letters), 0-9 (numbers), : (colon) and - (minus symbol)</li>
            <li>lines have to be terminated by paragraph</li>
          </ul>
        </div>
      </div>
      {{#if importStats}}
        {{#with importStats}}
          {{#if importExpected}}
            <h4 class="text-center">Expected results</h4>
          {{else}}
            <h4 class="text-center">Import results</h4>
          {{/if}}
          <div class="row">
            {{#if imported}}
              <div class="text-center {{getColClass}}">
                <div class="panel panel-success">
                  <p class="h2"><strong>{{imported}}</strong></p>
                  <p><b>Imported</b></p>
                </div>
              </div>
            {{/if}}
            {{#if error}}
              <div class="text-center {{getColClass}}">
                <div class="panel panel-warning">
                  <p class="h2"><strong>{{error}}</strong></p>
                  <p><b>Error</b></p>
                </div>
              </div>
            {{/if}}
          </div>
        {{/with}}
      {{/if}}
      {{#if importResults}}
        <div style="overflow-x: auto; max-height: 250px">
          <table class="table table-striped table-condensed">
            <thead>
            <tr>
              <th width="70" class="text-right" style="padding-right: 10px">Line</th>
              <th width="80">Status</th>
              <th>Import result</th>
            </tr>
            </thead>
            <tbody>
            {{#each importResults}}
              <tr>
                <td class="text-right" style="padding-right: 10px">{{getLineNumber @index}}</td>
                <td>{{convertStatus status}}</td>
                <td>{{message}}</td>
              </tr>
            {{/each}}
            </tbody>
          </table>
        </div>
      {{/if}}
    </form>
  {{/panel}}
</template>

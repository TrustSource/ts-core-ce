<template name="CSAFImportModal">
  <!-- Modal: CSAFImportModal -->
  <div class="modal fade" id="CSAFImportModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <h4 class="modal-title">Import CSAF</h4>
        </div>
        <form id="CSAFImportForm" enctype="multipart/form-data" method="post">
          <div class="modal-body">
            <div class="row">
              <div class="form-group col-xs-12">
                You may add <a target="_blank" href="https://docs.oasis-open.org/csaf/csaf/v2.0/os/csaf-v2.0-os.pdf" class="highlight">CSAF</a>-format from 3rd part tools using API
                or manual Upload. <a target="_blank" href="{{pathFor route='apiDocLatest'}}" class="highlight">Read more ...</a>
              </div>
              <div class="form-group col-xs-12">
                <label for="file">File</label>
                <div class="input-group input-group-file">
                  {{#with currentUpload}}
                    <span class="input-group-btn">
                        <span class="btn btn-default btn-file">
                          Uploading...
                        </span>
                      </span>
                    <input type="text" name="file" readonly="readonly" placeholder="{{file.name}}" class="form-control">
                  {{else}}
                    <span class="input-group-btn">
                        <span class="btn btn-default btn-file">
                          Browse...
                          <input type="file" name="file" id="file" accept=".json">
                        </span>
                      </span>
                    <input type="text" name="filename" readonly="readonly" placeholder="file name" class="form-control">
                  {{/with}}
                </div>
                {{#with currentUpload}}
                  <span id="progress">{{progress.get}}%</span>
                {{/with}}
              </div>
              <div class="form-group col-xs-12">
                <span class="help-block small">Specify the CSAF file (*.json)</span>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            {{#if loading}}
              <button type="button" disabled="disabled" class="btn btn-primary">
                <i class="fa fa-spinner fa-spin"></i> Import
              </button>
            {{else}}
              <button type="submit" class="btn btn-primary">
                Import
              </button>
            {{/if}}
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

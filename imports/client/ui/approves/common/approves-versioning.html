<template name="approvesVersioning">
  {{#if getProjectComponents}}
    <div class="row">
      <div class="col-sm-4">
        <div class="panel panel-default text-center">
          <p class="h2"><strong>{{counterComponentsTotal}}</strong></p>
          <p class="h5">{{__ 'components'}}</p>
        </div>
      </div>
      <div class="col-sm-4">
        <div class="panel panel-default text-center">
          <p class="h2"><strong>{{counterModules}}</strong></p>
          <p class="h5">{{__ 'modules'}}</p>
        </div>
      </div>
      <div class="col-sm-4">
        <div class="panel panel-default text-center">
          <p class="h2"><strong>{{counterComponents}}</strong></p>
          <p class="h5">{{__ 'affectedComponents'}}</p>
        </div>
      </div>
    </div>
    <div class="ts-panel obligation-list">
      {{#each getProjectComponents}}
        <div class="panel-body {{status}}">
          <div class="row">
            <div class="col-sm-6 text-left">
              <h5 style="word-wrap: break-word;">{{key}} ({{versions}})</h5>
              {{#each problems}}
                <div>
                  {{message}}
                </div>
              {{/each}}
            </div>
            <div class="col-sm-6">
              <small>{{getPluralized 'appearance' countPath}}</small>
              <div style="font-size: 0.7em;margin-top:5px">
                {{#each paths}}
                  <p>
                    <a href="{{pathFor route=actionRoute.route data=actionRoute.params query=actionRoute.query}}"
                       target="_blank">
                      {{path}}
                      <span class="fa fa-external-link inner-l-5"></span>
                    </a>
                  </p>
                {{/each}}
              </div>
            </div>
          </div>
        </div>
      {{/each}}
    </div>
  {{else}}
    {{#unless noDataInProject}}
      {{#panel}}
        <div class="text-primary">
          <i class="fa fa-spinner fa-spin"></i> {{__ 'LoadingReportData'}}
        </div>
      {{/panel}}
    {{/unless}}
  {{/if}}
  {{#if requestInProgress}}
    {{#panel}}
        <div class="text-primary">
          <i class="fa fa-spinner fa-spin"></i> {{__ 'LoadingReportData'}}
        </div>
    {{/panel}}
  {{/if}}
  {{#if noDataInProject}}
    {{> reactiveTableNoData}}
  {{/if}}
</template>

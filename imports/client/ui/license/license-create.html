<template name="licenseCreate">
  {{#if isInRole 'company_component_manager' companyId}}
    <button type="button" class="btn btn-default btn-sm m-l-sm" data-toggle="modal" data-target="#createLicense">
      <span class="fa fa-plus" aria-hidden="true"></span> Add license
    </button>

    <!-- Modal: createLicense -->
    <div class="modal fade" id="createLicense" role="dialog" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="ts-accent-line"></div>
          <div class="modal-header text-center">
            <i class="fa fa-plus-circle ts-big-icon text-success"></i>
            <br/>
            <h4 class="modal-title">Add license</h4>
          </div>
          <form id="createLicenseForm" autocomplete="off">
            <div class="modal-body">
              <div class="row">
                <div class="form-group col-xs-12">
                  <label for="createLicenseKey">License key</label>
                  <input type="text" id="createLicenseKey" name="licenseKey" class="form-control" maxlength="100">
                  <span class="help-block small">The SPDX identifier where one exists, e.g. MIT or Apache-2.0. It cannot be changed later.</span>
                </div>
                <div class="form-group col-xs-12">
                  <label for="createLicenseName">Name</label>
                  <input type="text" id="createLicenseName" name="licenseName" class="form-control" maxlength="200">
                </div>
                <div class="form-group col-xs-12">
                  <label for="createLicenseUrl">URL</label>
                  <input type="url" id="createLicenseUrl" name="licenseUrl" class="form-control" maxlength="2000">
                </div>
                <div class="form-group col-xs-12">
                  <label for="createLicenseText">License text</label>
                  <textarea id="createLicenseText" name="licenseText" class="form-control" rows="8"></textarea>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
              <button type="submit" class="btn btn-primary">Add license</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  {{/if}}
</template>

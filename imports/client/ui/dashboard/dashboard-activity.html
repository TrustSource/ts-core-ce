<template name="dashboardActivity">
  <div class="row">
    <div class="col-lg-12">
      {{#panel title=(__ "ActivityLog")}}
        <div class="timeline">
          <div class="timeline-item">
            <div class="timeline-segment">
              <div class="timeline-divider"></div>
            </div>
            <div class="timeline-content"></div>
          </div>
          {{#each getLogs}}
            <div class="timeline-item">
              <div class="timeline-segment">
                <div class="timeline-media {{timelineClass}} circle sq-24">
                  <div class="fa {{timelineIcon}} white"></div>
                </div>
              </div>
              <div class="timeline-content">
                <div class="timeline-row">
                  <span>{{getName}}</span> <small>({{{dateFromNow date}}})</small>
                </div>
                <div class="timeline-row">
                  <h6><strong>{{getLogType this}}</strong></h6>
                  <p style="word-break: break-all;">
                    <small>{{message}}</small>
                  </p>
                </div>
              </div>
            </div>
          {{/each}}
        </div>
        <div class="clearfix inner-tb-5">
          <a href="{{pathFor route='companyLogs'}}" class="btn btn-default btn-block">{{__ 'ViewAllLogs'}}</a>
        </div>
      {{/panel}}
    </div>
  </div>
</template>

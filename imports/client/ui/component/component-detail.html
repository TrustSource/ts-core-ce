<template name="componentDetailNotFound">
  <div class="content component-detail">
    <div class="panel panel-primary">
      <div class="panel-heading">{{__ 'SorryComponentIsNotAvailable'}}</div>
    </div>
  </div>
</template>

<template name="componentDetail">
  {{#if this}}
  {{# pageHeader}}
    <div class="components-header">
      <div class="components-header-left">
        <h2 class="font-light m-b-xs">{{{getPkgMgrIcon getKey true}}} {{getName}}</h2>
        {{#if getDescription}}
          <small>{{getDescription}}</small>
        {{else}}
          <small>Component Details</small>
        {{/if}}
      </div>
      <div class="components-header-actions">
        {{#if isInfrastructureComponent}}
          {{#if isInRole 'company_component_manager' companyId}}
            <a href="{{pathFor route='infrastructureManagementComponentsEdit'}}"
               class="btn btn-default">{{__ 'Edit'}}</a>
          {{/if}}
        {{else}}
          {{#if isInRole 'company_component_manager' companyId}}
            <a href="{{pathFor route='criticalComponentsComponentDetailsEdit'}}"
               class="btn btn-default">{{__ 'Edit'}}</a>
          {{/if}}
        {{/if}}
      </div>
    </div>
  {{/pageHeader}}

  <div class="content component-detail">

    <div class="panel" id="info-panel">
      <div class="panel-heading">
        <h4 class="inner-b-0">{{__ 'Information'}}</h4>
      </div>
      <div class="panel-body">
        <div class="row">
          <div class="col-md-8">
            <dl class="dl-horizontal">
              <dt>{{__ 'Key'}}</dt>
              <dd>{{getKey}}</dd>

              <dt>{{__ 'purlPackageURL'}}</dt>
              <dd>{{getPackageUrl}}</dd>

              <dt>{{__ 'Homepage'}}</dt>
              <dd>
                {{#if getUrl 'homepage'}}<a target='_blank'
                                            href="{{getUrl 'homepage'}}">{{getUrl 'homepage'}}</a>
                {{else}}{{__ 'unknown'}}
                {{/if}}
              </dd>

              <dt>{{__ 'Repository'}}</dt>
              <dd>
                {{#if getUrl 'repository'}}<a target='_blank'
                                              href='{{getUrl 'repository'}}'>{{getUrl
                  'repository'}}</a>
                {{else}}{{__ 'unknown'}}
                {{/if}}
              </dd>

              <dt>{{__ 'Language'}}</dt>
              <dd>
                {{getLanguage}}
              </dd>

              <dt>{{__ 'CryptoAlgorithms'}}</dt>
              <dd>
                <ul class="pinner-l-20 inner-b-0">
                  {{#each cryptoAlgorithmsListHtml getAlgorithms}}
                    <li>{{algorithm}} {{strength}}</li>
                  {{/each}}
                </ul>
              </dd>

              <dt>AI / ML models</dt>
              <dd>
                <ul class="pinner-l-20 inner-b-0">
                  {{#each getAiModels}}
                    <li>{{name}}{{#if version}} {{version}}{{/if}}{{#if provider}} · {{provider}}{{/if}}{{#if task}} · {{task}}{{/if}}</li>
                  {{/each}}
                </ul>
              </dd>

              <dt>{{__ 'LastUpdate'}}</dt>
              <dd>
                {{dateFormat getUpdated}} {{__ 'by'}} {{getUpdatedBy}}
              </dd>
            </dl>
          </div>
        </div>
      </div>
    </div>

    {{#if getComment}}
      <div class="panel" id="comment-panel">
        <div class="panel-heading">
          <h4 class="inner-b-0">{{__ 'Comment'}}</h4>
        </div>
        <div class="panel-body">
          <div>{{getComment}}</div>
        </div>
      </div>
    {{/if}}

    {{> componentCommercialTerms component=this.data disabled=true}}

    {{#if getVersions true}}
      <div class="panel component-version">
        <div class="panel-heading version-panel-heading">
          <h4 class="inner-b-0">
            {{__ 'Versions'}}
            {{> versionCount filter=versionFilter matched=getVersionsMatching.length total=countVersions}}
          </h4>
          {{> versionSearch filter=versionFilter matched=getVersionsMatching.length
                            total=countVersions}}
        </div>
        <div class="panel-body">
          {{> paginationList collection=getVersionsMatching list=getVersionsFiltered}}
          <table class="table table-condensed">
            <tbody>
            {{#each getVersionsFiltered}}
              <tr class="inner-t-10">
                <td width="200">
                  <span
                    class="label label-success label-block label-lg inner-b-5 label-version">{{getVersion}}</span><br>
                  <span>
                    {{#if getReleaseDate}}
                      {{__ 'ReleaseDate'}} {{dateFormat getReleaseDate 'll'}}
                    {{else}}{{__ 'ReleaseDate'}} {{__ 'NA'}}{{/if}}
                  </span>
                </td>
                <td class="pinner-0i">
                  {{#if getPackageUrl}}
                    <p class="pinner-t-5 pinner-l-5 pinner-b-0 m-b-none"><b>{{__ 'purl'}}</b>: {{getPackageUrl}}</p>
                  {{/if}}
                  <table class="table table-condensed inner-0">
                    <thead>
                    <tr>
                      <th width="36" title="{{__ 'Verified'}}">{{__ 'Ver'}}</th>
                      <th>{{__ 'License'}}</th>
                      <th width="200">{{__ 'Url'}}</th>
                    </tr>
                    </thead>
                    <tbody>
                    {{#if getLicenses component.getDeclaredLicenses}}
                      {{#each getLicenses component.getDeclaredLicenses}}
                        <tr>
                          <td>
                            {{#if getKey}}
                              <div class="text-center checkbox-{{getQosStr}}"></div>
                            {{/if}}
                          </td>
                          <td>
                            {{#if getKey}}
                              <a href="{{pathFor 'licenseDetail' key=getKey }}">{{getName}}</a>
                            {{else}}
                              {{#if getName}}
                                {{getName}}&nbsp;&nbsp;<span class="text-danger">{{__ 'KeyMissing'}}</span>
                              {{else}}
                                <span class="text-danger">{{__ 'KeyAndNameMissing'}}</span>
                              {{/if}}
                            {{/if}}
                          </td>
                          <td>
                            {{#if getUrl}}
                              <a target='_blank' title="{{getUrl}}" href="{{getUrl}}" class="text-center">
                                <i class="fa fa-external-link"></i>
                              </a>
                            {{else}}
                              {{__ 'NA'}}
                            {{/if}}
                          </td>
                        </tr>
                      {{/each}}
                    {{else}}
                      <tr>
                        <td colspan="3"><span class="text-danger">{{__ 'KeyAndNameMissing'}}</span></td>
                      </tr>
                    {{/if}}
                    </tbody>
                  </table>
                  {{#if getChecksums}}
                    <table class="table table-condensed inner-0">
                      <thead>
                      <tr>
                        <th width="36" title="{{__ 'Verified'}}">{{__ 'Ver'}}</th>
                        <th>{{__ 'Checksum'}}</th>
                      </tr>
                      </thead>
                      <tbody>
                      {{#each getChecksums}}
                        <tr>
                          <td>
                            <div class="text-center comp-edit-chksum-verified checkbox-{{getQosStr}}"></div>
                          </td>
                          <td>{{getChecksum}}</td>
                        </tr>
                      {{/each}}
                      </tbody>
                    </table>
                  {{/if}}
                  {{#if getCopyright}}
                    <table class="table table-condensed inner-0">
                      <thead>
                      <tr>
                        <th>{{__ 'Copyright'}}</th>
                      </tr>
                      </thead>
                      <tbody>
                      <tr>
                        <td>{{getCopyright}}</td>
                      </tr>
                      </tbody>
                    </table>
                  {{/if}}
                </td>
              </tr>
              {{#if hasVuln}}
                <tr class="comp-vulnerability">
                  <td class="border-top-none">
                  </td>
                  <td class="border-top-none pinner-0i">
                    {{> cvesDetails vulns=getVuln}}
                  </td>
                </tr>
              {{/if}}
            {{/each}}
            </tbody>
          </table>
          {{#unless getVersionsFiltered}}
            {{> reactiveTableNoData}}
          {{/unless}}
          {{> paginationList collection=getVersionsMatching list=getVersionsFiltered}}
        </div>
      </div>
    {{/if}}
  </div>
  {{else}}
    {{> componentDetailNotFound}}
  {{/if}}
</template>

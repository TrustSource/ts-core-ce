<template name="componentDetailsCreate">
  {{#if isInRole 'company_component_manager' companyId}}
    <a href="#" class="btn btn-primary btn-xs showCreateLakeComponent">
      <span class="fa fa-puzzle-piece" aria-hidden="true"></span> {{__ 'AddComponent'}}</a>

    <!-- Modal: createLakeComponent -->
    <div class="modal fade" id="createLakeComponent" tabindex="-1" role="dialog"
         aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="ts-accent-line"></div>
          <div class="modal-header text-center">
            <i class="fa fa-puzzle-piece ts-big-icon text-success"></i>
            <br/>
            <h4 class="modal-title">{{__ 'AddComponent'}}</h4>
            <br/>
            <div class="{{createComponentMsgType}}"
                 id="form-messages">{{createComponentMsg}}</div>
          </div>
          <form id="createLakeComponentForm">
            <div class="modal-body">
              <div class="row">
                <div class="form-group col-xs-6">
                  <label for="componentName">{{__ 'Name'}}</label>
                  <input type="text" value="" id="componentName" class="form-control"
                         name="componentName">
                  <span class="help-block small">{{__ 'SpecifyTheNameOfTheNewComponent'}}</span>
                </div>
                <div class="form-group col-xs-6">
                  <label for="componentKey">{{__ 'Key'}}</label>
                  <input type="text" value="" id="componentKey" class="form-control"
                         name="componentKey">
                  <span class="help-block small">{{__ 'SpecifyTheKeyOfTheNewComponent'}}</span>
                </div>
                <div class="form-group col-xs-12">
                  <label for="componentVersions">{{__ 'Versions'}}</label>
                  <input type="text" value="" id="componentVersions" class="form-control"
                         name="componentVersions">
                  <span class="help-block small">{{__ 'SpecifyTheVersionsOfTheComponent'}}</span>
                </div>
                <div class="form-group col-xs-6">
                  <label for="componentHomepage">{{__ 'Homepage'}}</label>
                  <input type="text" value="" id="componentHomepage" class="form-control"
                         name="componentHomepage">
                  <span class="help-block small">{{__ 'SpecifyTheHomepage'}}</span>
                </div>
                <div class="form-group col-xs-6">
                  <label for="componentRepository">{{__ 'Repository'}}</label>
                  <input type="text" value="" id="componentRepository" class="form-control"
                         name="componentRepository">
                  <span class="help-block small">{{__ 'SpecifyTheRepository'}}</span>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-default" data-dismiss="modal">{{__ 'Close'}}</button>
              <button type="submit" class="btn btn-primary">{{__ 'CreateComponent'}}</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  {{/if}}
</template>

<template name="releasesDetails">
  {{# pageHeader}}
    <div class="approves-detail-header">
      <div class="approves-detail-header-left">
        <h2 class="font-light m-b-none">{{name}}</h2>
        {{#if getApprovePurl}}
          <small class="text-muted">{{getApprovePurl}}</small>
        {{/if}}
        {{#if getApproveDescription}}
          <small class="text-muted">{{getApproveDescription}}</small>
        {{/if}}
      </div>
      <div class="approves-detail-header-actions">
        <a class="btn btn-primary btn-xs" target="_blank"
           href="{{pathFor route='sbomFileDetails' data=getReportOptions}}" title="View SBOM">
          <span class="fa fa-cubes"></span> SBOM</a>
        {{> viewBinary binaryLinks=binaryLinks size='btn-xs'}}
        {{> viewPublishedKeys params=getRouteOptions size='btn-xs'}}
        <div class="dropdown">
          <span class="btn btn-success dropdown-toggle" data-toggle="dropdown">
            <i class="fa fa-check-circle"></i> {{__ 'Approved'}} <span class="caret"></span>
          </span>
          <ul class="dropdown-menu dropdown-menu-right approves-detail-dropdown">
            <li><span><strong>{{__ 'by'}}:</strong> {{closedByName}}</span></li>
            <li><span><strong>{{__ 'Date'}}:</strong> {{dateFormat date=approved dflt='-- --'}}</span></li>
          </ul>
        </div>
      </div>
    </div>
  {{/pageHeader}}
  <div class="approves-detail-tabs">
    <ul class="nav nav-tabs">
      <li class="{{activeTab 'releasesDetailsOverview'}}">
        <a href="{{pathFor route='releasesDetailsOverview' data=getRouteOptions}}" title="Overview">
          <span class="fa fa-info"></span> Overview</a>
      </li>
      <li class="{{activeTab 'releasesDetailsNewVulnerabilities'}}">
        <a href="{{pathFor route='releasesDetailsNewVulnerabilities' data=getRouteOptions}}" title="New vulnerabilities">
          <span class="fa fa-shield-halved"></span> New vulnerabilities</a>
      </li>
      <li class="{{activeTab 'releasesDetailsVulnerabilities'}}">
        <a href="{{pathFor route='releasesDetailsVulnerabilities' data=getRouteOptions}}" title="Vulnerabilities">
          <span class="fa fa-shield-halved"></span> Vulnerabilities</a>
      </li>
      <li class="{{activeTab 'releasesDetailsExportControl'}}">
        <a href="{{pathFor route='releasesDetailsExportControl' data=getRouteOptions}}" title="Export control">
          <span class="fa fa-lock"></span> Export control</a>
      </li>
    </ul>
  </div>
</template>

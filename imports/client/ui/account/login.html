<template name="login">
  <div class="login-container login-container-narrow">
    <div class="login_bg"></div>
    <div class="row">
      <div class="col-md-12">
        <div class="text-center m-b-md">
          <h3>
            <a href="{{pathFor route='landing'}}">
              <img src="/logo.png" alt="{{app 'name'}}" style="max-height: 47px; margin-left: 19px; margin-bottom: 10px;">
            </a>
          </h3>
          <h4>{{__ 'SignIn'}}</h4>
        </div>
        <div class="ts-panel">
          <div class="panel-body">
            <form id="loginForm" class="errors-below">
              <div class="form-group">
                <label class="control-label" for="username">{{__ 'Username'}}</label>
                <input type="text" autocomplete="username" placeholder="example@gmail.com" value="{{username}}" name="username"
                       id="username"
                       class="form-control">
              </div>
              <div class="form-group">
                <span class="pull-right">
                  <a class="highlight" id="resetpwd">{{__ 'IForgotMyPassword'}}</a>
                </span>
                <label class="control-label" for="password">
                  {{__ 'Password'}}
                </label>
                <input type="password" autocomplete="current-password" placeholder="******" value="" name="password" id="password"
                       class="form-control">
              </div>
              <div class="text-danger inner-b-5" id="form-messages">{{errorMsg}}</div>
              <div class="form-group">
                <button class="btn btn-primary btn-block" type="submit">{{__ 'Login'}}</button>
              </div>
              {{#if registrationEnabled}}
              <div class="text-center">
                <a class="highlight" id="register">{{__ 'NoAccountYetGetOneForFree'}}</a>
              </div>
              {{/if}}
            </form>
          </div>
        </div>
      </div>
    </div>
    {{> blankLayoutFooter}}
  </div>
</template>

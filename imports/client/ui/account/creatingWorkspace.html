<template name="creatingWorkspace">
  <div class="creating-workspace-container">
    <div class="login_bg"></div>
    <div class="creating-workspace-card">
      <div class="text-center m-b-md">
        <h3>
          <img src="/logo.png" alt="{{app 'name'}}" style="max-height: 47px;">
        </h3>
      </div>
      <div class="text-center">
        <div class="creating-workspace-spinner"></div>
        <h4 class="m-t-md">{{__ 'SettingUpYourWorkspace'}}</h4>
        <p class="text-muted">{{__ 'SettingUpYourWorkspaceSub'}}</p>
        {{#if isSlow}}
          <p class="text-warning m-t-md">
            {{__ 'SettingUpYourWorkspaceSlow'}}
            <a href="{{app 'supportUrl'}}" target="_blank" rel="noopener noreferrer">{{__ 'ReportAnIssue'}}</a>.
          </p>
        {{/if}}
      </div>
    </div>
  </div>
</template>

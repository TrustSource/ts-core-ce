<template name="signup">
  <div class="login-container">
    <div class="login_bg"></div>
    <div class="row">
      <div class="col-md-12">
        <div class="text-center m-b-md">
          <h3>
            <a href="{{pathFor route='login'}}">
              <img src="/logo.png" alt="{{app 'name'}}" style="max-height: 47px; margin-left: 19px; margin-bottom: 10px;">
            </a>
          </h3>
          <h4>{{__ 'SignUp'}}</h4>
          <h5>
            <small class="text-danger-i">{{__ 'PasswordMustBeAtLeast'}} <strong>{{__ '12Characters'}}</strong> 
            {{__ 'includingOneCapitalLetter'}}</small>
          </h5>
        </div>
        <div class="ts-panel">
          <div class="panel-body">
            <form id="signupForm" class="errors-below">
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>{{__ 'CompanyName'}}</label>
                    <input type="text" class="form-control" readonly="true" value="{{companyName}}">
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="name">{{__ 'Name'}}</label>
                    <input type="text" name="name" class="form-control" id="name" value="{{userName}}">
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="password">{{__ 'Password'}}</label>
                    <input type="password" name="password" class="form-control" id="password">
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="password_repeat">{{__ 'RepeatPassword'}}</label>
                    <input type="password" name="password_repeat" class="form-control" id="password_repeat">
                  </div>
                </div>
                <div class="col-md-12">
                  <div class="form-group">
                    <button class="btn btn-primary btn-block">{{__ 'CreateAccount'}}</button>
                  </div>
                  <div class="text-center">
                    <a class="highlight" href="{{pathFor route='login'}}">{{__ 'DoNotWantAcceptInvitation'}}</a>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    {{> blankLayoutFooter}}
  </div>
</template>

<template name="resetPassword">
  <div class="login-container login-container-narrow">
    <div class="login_bg"></div>
    <div class="row">
      <div class="col-md-12">
        <div class="text-center m-b-md">
          <h3>
            <a href="{{pathFor route='login'}}">
              <img src="/logo.png" alt="{{app 'name'}}" style="max-height: 47px; margin-left: 19px; margin-bottom: 10px;">
            </a>
          </h3>
          <h4>{{__ 'ResetPassword'}}</h4>
          <h5>
            <small class="text-danger-i">{{__ 'PasswordMustBeAtLeast'}} <strong>{{__ '12Characters'}}</strong> 
              {{__ 'includingOneCapitalLetter'}}</small>
          </h5>
        </div>
        <div class="ts-panel">
          <div class="panel-body">
            <form id="resetPasswordForm" class="errors-below">
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="password">{{__ 'NewPassword'}}</label>
                    <input type="password" value="" id="password" class="form-control" name="password">
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="password_repeat">{{__ 'RepeatNewPassword'}}</label>
                    <input type="password" value="" id="password_repeat" class="form-control" name="password_repeat">
                  </div>
                </div>
                <div class="col-md-12">
                  <div class="form-group">
                    <div class="text-center">
                      <button class="btn btn-primary btn-block">{{__ 'ResetPassword'}}</button>
                    </div>
                  </div>
                  <div class="text-center">
                    <a class="highlight" id="cancel">{{__ 'DoNotWantToChangeYourPassword'}}</a>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    {{> blankLayoutFooter}}
  </div>
</template>

<template name="scannersList">

  {{> pageHeader title="CI/CD Integrations" desc="Review list of available integration"  }}

  <div class="content">
    <div class="row scanners-grid">
      {{#with scannerItems}}
        <div class="col-xs-12">
          <h3 class="font-light">Package managers</h3>
        </div>
        {{#each pkg}}
          {{> scannersListItem item=this}}
        {{/each}}
        <div class="col-xs-12">
          <h3 class="font-light">Continuous development tools</h3>
        </div>
        {{#each pipe}}
          {{> scannersListItem item=this}}
        {{/each}}
        <div class="col-xs-12">
          <h3 class="font-light">Containers</h3>
        </div>
        {{#each containers}}
          {{> scannersListItem item=this}}
        {{/each}}
        <div class="col-xs-12">
          <h3 class="font-light">Development languages</h3>
        </div>
        {{#each lang}}
          {{> scannersListItem item=this}}
        {{/each}}
        <div class="col-xs-12">
          <h3 class="font-light">IDE Plugins</h3>
        </div>
        {{#each plugin}}
          {{> scannersListItem item=this}}
        {{/each}}
      {{/with}}
    </div>
  </div>
</template>


<template name="scannersListItem">
  <div class="col-xs-6 col-sm-4 col-md-3 col-lg-3 grey-filter">
    <div class="panel panel-default">
      <div class="panel-body text-center">
        <div class="row">
          <div class="col-md-12 scanner-logo-holder">
            <img src="/scanners/{{item.image}}" class="scanner-logo" alt="">
          </div>
          <div class="col-md-12">
            <h4>
              {{item.name}}
            </h4>
          </div>
          <div class="col-md-12 scanner-links-buffer">
            {{#each item.links}}
              <a href="{{link}}" target="_blank">
                <span class="highlight">{{type}}</span>
                <i class="fa fa-external-link"></i>
              </a>
            {{/each}}
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

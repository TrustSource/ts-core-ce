<template name="policyNotification">
  <div class="modal fade" id="notifyPolicy" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <i class="fa fa-file-powerpoint-o ts-big-icon text-success"></i>
          <br/>
          <h4 class="modal-title">New policy updates</h4>
        </div>
        <form id="notifyPolicyForm">
          <div class="modal-body">
            <div class="row">
              <h4>{{policy.name}}
                <small class="pull-right" style="padding-top: 4px">Active from: {{getDateFormated policy.activeFromDate true}}</small></h4>
              <p>{{policy.description}}</p>
              {{#if getFile policy}}
                <a href="{{getFile policy}}" target="_blank" class="highlight view-file" download>View policy file</a>
              {{/if}}
              <p class="text-right"><small>Updated: {{getDateFormated policy.updatedDate}}</small></p>
            </div>
          </div>
          <div class="modal-footer">
            {{#if fileIsNotViewed}}
              <div class="pull-left text-danger" style="padding-top: 8px">You should review new policy first</div>
            {{/if}}
            <button type="button" class="btn btn-default close-notification" data-dismiss="modal">Close
            </button>
            <button type="submit" class="btn btn-primary btn-confirm-policy">Confirm</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

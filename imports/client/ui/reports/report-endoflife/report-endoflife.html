<template name="reportEndoflife">

  {{#pageHeader}}
    <div class="reports-header">
      <div class="reports-header-left">
        <h2 class="font-light m-b-xs">End-of-life overview</h2>
        <small>Overview of all component end-of-life problems</small>
      </div>
      <div class="reports-header-actions">
        <select class="form-control current-project select2">
          <option value="ALL" selected="{{isActivePortfolio}}">Whole portfolio</option>
          {{#each projectList}}
            <option value="{{_id}}" selected="{{isActiveProject}}">{{name}}</option>
          {{/each}}
        </select>
      </div>
    </div>
  {{/pageHeader}}

  <div class="content">
    {{#if reportProjectEndoflife}}
      <div class="text-right inner-b-10">
        <button class="btn btn-primary btn-xs export-as-pdf" type="button">
          <span class="fa fa-file-pdf-o" aria-hidden="true"></span> Export as PDF
        </button>
      </div>
      <div class="row">
        <div class="col-sm-3">
          <div class="panel panel-success text-center">
            <p class="h2"><strong>{{counterComponentsTotal}}</strong></p>
            <p class="h5">components</p>
          </div>
        </div>
        <div class="col-sm-3">
          <div class="panel panel-default text-center">
            <p class="h2"><strong>{{counterModules}}</strong></p>
            <p class="h5">modules</p>
          </div>
        </div>
        <div class="col-sm-3">
          <div class="panel panel-danger text-center">
            <p class="h2"><strong>{{counterViolations}}</strong></p>
            <p class="h5">violations</p>
          </div>
        </div>
        <div class="col-sm-3">
          <div class="panel panel-warning text-center">
            <p class="h2"><strong>{{counterWarnings}}</strong></p>
            <p class="h5">warnings</p>
          </div>
        </div>
      </div>
      {{#with reportProjectEndoflifeStatus}}
        {{#if modules.length}}
          <div class="panel panel-default">
            <div class="panel-heading">
              <h5>Analyzed modules</h5>
            </div>
            <div class="panel-body">
              {{#each modules}}
                {{> moduleAnalysisMetaLink module=this}}
              {{/each}}
            </div>
          </div>
        {{/if}}
        {{#if projects.length}}
          <div class="panel panel-default">
            <div class="panel-heading">
              <h5>Impacted projects</h5>
            </div>
            <div class="panel-body">
              {{#each projects}}
                {{> projectMetaLink project=this}}
              {{/each}}
            </div>
          </div>
        {{/if}}
      {{/with}}
      <div class="ts-panel obligation-list">
        {{#each reportProjectEndoflife}}
          <div class="panel-body {{status}}">
            <div class="row">
              <div class="col-sm-4 text-left">
                <h5 style="word-wrap: break-word;">{{key}} ({{versions}})</h5>
                {{#each problems}}
                  <div>
                    {{message}}
                  </div>
                {{/each}}
              </div>
              <div class="col-sm-5">
                <small>{{getPluralized 'appearance' countPath}}</small>
                <div style="font-size: 0.7em;margin-top:5px">
                  {{#each getPaths}}
                    <p>
                      <a href="{{pathFor route=actionRoute.route data=actionRoute.params query=actionRoute.query}}"
                         target="_blank">
                        {{getPathsProject}}{{path}}
                        <span class="fa fa-external-link inner-l-5"></span>
                      </a>
                    </p>
                  {{/each}}
                </div>
              </div>
              <div class="col-sm-3">
                <div>
                  <p class="m-b-sm">
                    <a href class="send_alert"
                       target="_blank">
                      <span class="fa fa-bell-o"></span> Send alert to project manager
                    </a>
                  </p>
                  <p class="m-b-sm">
                    {{> algorithmsIssuesLink description=getProblemDescription projectId=projectId repository=getRepository githubLink=githubLink}}
                  </p>
                </div>
              </div>
            </div>
          </div>
        {{/each}}
      </div>
    {{/if}}
    {{#if selectProject}}
      {{#panel}}
        <div class="text-info">
          <i class="fa fa-check-circle-o"></i> Please select the project to run a report on the upper right
        </div>
      {{/panel}}
    {{/if}}
    {{#if requestInProgress}}
      {{#panel}}
        <div class="text-primary">
          <i class="fa fa-spinner fa-spin"></i> Loading report data for {{getProjectName}}, please wait...
        </div>
      {{/panel}}
    {{/if}}
    {{#if noDataInProject}}
      <div class="text-right inner-b-10">
        <button class="btn btn-primary btn-xs export-as-pdf" type="button">
          <span class="fa fa-file-pdf-o" aria-hidden="true"></span> Export as PDF
        </button>
      </div>
      {{> reactiveTableNoData}}
    {{/if}}
  </div>
</template>

<template name="reportImpactComponent">

  {{# pageHeader title="Component impact report" desc="List of all projects impacted by component"  }}{{/pageHeader}}

  <div class="content pinner-t-5">
    <div class="panel-heading actions no-top clearfix">
      <form class="pull-left form-inline" id="componentImpactForm">
        <div class="form-group">
          <h5 class="inner-r-10"><strong class="fa fa-filter"></strong></h5>
        </div>
        <div class="form-group" style="width:400px;">
          <input class="form-control typeahead w100i" name="currentComponent" type="text"
                 placeholder="Select component" autocomplete="off" spellcheck="off">
        </div>
        {{#if versions}}
          <div class="form-group inner-r-10" style="width:200px;">
            <select value="" id="currentVersion"
                    class="form-control select2"
                    name="currentVersion">
              <option value="">
                --Select version--
              </option>
              {{#each versions}}
                <option value="{{version}}" selected="{{isCurrentVersion version}}">
                  {{version}} {{#if getLicenses}}({{getLicenses}}){{/if}}
                </option>
              {{/each}}
            </select>
          </div>
        {{/if}}
        <button class="btn btn-primary check_for" title="Check component" type="submit">
          <i class="fa fa-play"></i> Check
        </button>
        <button class="btn btn-default reset_view" title="Reset filters" type="button">
          <i class="fa fa-trash"></i>
        </button>
      </form>
    </div>
    {{#if beforeRequest}}
      <div class="panel panel-default">
        <div class="panel-heading">
          <h3 class="panel-title">Please specify component</h3>
        </div>
        <div class="panel-body">
          <p>Component is required to execute check in your portfolio</p>
        </div>
      </div>
    {{else}}
      {{#if requestInProgress}}
        {{#panel}}
          <div class="text-primary">
            <i class="fa fa-spinner fa-spin"></i> Loading report data for component {{#with currentComponent}}{{name}}{{/with}}, please
            wait...
          </div>
        {{/panel}}
      {{else}}
        {{#with componentDetails}}
          <div>
            {{#panel title="Component description"}}
              <a target="_blank" href="{{pathFor 'componentDetail'}}">
                <span class="inline-block m-l-xs">{{name}} {{#if version}}({{version}}){{/if}}</span>
                {{#if _id}}
                  <span class="fa fa-external-link icon-inner-top"></span>
                {{/if}}
              </a>
              <p class="inner-b-0">{{description}}</p>
            {{/panel}}
          </div>
        {{/with}}
        {{#if getProject}}
          <div class="text-right inner-b-10">
            <button class="btn btn-default btn-xs send_alert" title="Send alert" type="button">
              <i class="fa fa-bell-o"></i> Send alert
            </button>
            <button class="btn btn-primary btn-xs export-as-pdf" type="button">
              <span class="fa fa-file-pdf-o" aria-hidden="true"></span> Export as PDF
            </button>
          </div>
          <div class="ts-panel obligation-list">
            {{#each getProject}}
              <div class="panel-body">
                <div class="row">
                  <div class="col-sm-6 text-left">
                    <h4 style="word-wrap: break-word;" class="inner-t-0">
                      <a href="{{pathFor route=actionRoute.route data=actionRoute.params}}"
                         target="_blank">
                        {{name}}
                        <span class="fa fa-external-link inner-l-5"></span>
                      </a>
                    </h4>
                    {{#with relatedUsers.defaultProjectManager.profile}}
                      <p class="inner-b-5">
                        Project manager: {{name}}
                        <a href="mailto:{{email}}" target="_blank">{{email}} <span class="fa fa-external-link inner-l-5"></span></a>
                      </p>
                    {{/with}}
                    {{#with relatedUsers.defaultComplianceManager.profile}}
                      <p class="inner-b-5">
                        Compliance manager: {{name}}
                        <a href="mailto:{{email}}" target="_blank">{{email}} <span class="fa fa-external-link inner-l-5"></span></a>
                      </p>
                    {{/with}}
                    {{#each modules}}
                      {{> moduleAnalysisMetaLink module=this}}
                    {{/each}}
                  </div>
                  <div class="col-sm-6">
                    <p>
                      {{#unless isUnasigned}}
                        {{#if haveDescription description}}
                          <p>{{description}}</p>
                        {{else}}
                          <p>No goals mentioned in project settings.</p>
                        {{/if}}
                      {{/unless}}
                    </p>
                  </div>
                </div>
              </div>
            {{/each}}
          </div>
        {{else}}
          <div class="panel panel-success">
            <div class="panel-heading">
              <h3 class="panel-title">No impact</h3>
            </div>
            <div class="panel-body">
              <p>No projects or modules are impacted by {{#with currentComponent}}{{name}}{{/with}}</p>
            </div>
          </div>
        {{/if}}
      {{/if}}
    {{/if}}
  </div>
</template>

<template name="sbomFileDetailsVersion">
  <!-- Modal: reportSbomVersion -->
  <div class="modal fade" id="reportSbomVersion" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <i class="fa fa-plus ts-big-icon text-success"></i>
          <br/>
          <h4 class="modal-title">Increment version</h4>
        </div>
        <form id="reportSbomVersionForm">
          <div class="modal-body">
            <div class="row">
              <div class="form-group col-xs-12 text-center">
                {{> semanticVersion document=sbomFile}}
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Save version</button>
            <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

<template name="sbomFileDetails">
  {{# pageHeader}}
    <div class="approves-detail-header">
      <div class="approves-detail-header-left">
        <h2 class="font-light m-b-none">
          {{getName}} <sup><small>{{release}}</small></sup>
          <small class="text-muted">SBOM file version {{version}}</small>
        </h2>
        {{#if getDescription}}
          <small class="text-muted">{{getDescription}}</small>
        {{/if}}
      </div>
      <div class="approves-detail-header-actions">
        {{#with sbomFile}}
          <button class="btn btn-primary export_as_pdf_report" type="button">
            <span class="fa fa-file-pdf-o"></span> PDF
          </button>
          <div class="dropdown">
            <button type="button" class="btn btn-primary dropdown-toggle" data-toggle="dropdown">
              <span class="fa fa-file-code-o"></span> CycloneDX <span class="caret"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-right">
              <li><a class="export-as-cyclonedx" data-variant="SBOM">SBOM (components)</a></li>
              <li><a class="export-as-cyclonedx" data-variant="CBOM">CBOM (cryptography)</a></li>
              <li><a class="export-as-cyclonedx" data-variant="AIBOM">AIBOM (AI / ML)</a></li>
              <li><a class="export-as-cyclonedx" data-variant="FULL">Full BOM (components + crypto + AI)</a></li>
            </ul>
          </div>
          <button class="btn btn-primary export-as-spdx" type="button">
            <span class="fa fa-file-o"></span> SPDX
          </button>
          {{#unless disabled}}
            <a class="btn btn-default open-version-modal">
              <span class="fa fa-plus"></span> Version
            </a>
            <button class="btn btn-default freeze_version" type="button">
              <span class="fa fa-snowflake-o"></span> Freeze
            </button>
          {{else}}
            <span class="btn btn-default disabled">
              <span class="fa fa-snowflake-o"></span> Frozen: {{{dateFromNow disabled}}}
            </span>
          {{/unless}}
        {{/with}}
      </div>
    </div>
  {{/pageHeader}}
  {{> sbomFileDetailsVersion sbomFile=sbomFile updateSbomFile=updateSbomFile}}
  {{#if missingData}}
    <div class="content pinner-b-0 pinner-t-5" style="margin-bottom: -15px;">
      <div class="alert alert-danger inner-b-0">
        <p>
          <i class="fa fa-exclamation-circle"></i> DEPRECATED <br>
          Project or module was removed so this SBOM file is deprecated
        </p>
      </div>

    </div>
  {{/if}}
  <div class="row sbom-detail-columns">
    <div class="col-md-8">
      <div class="sbom-view-left">
          {{#if list.length}}
            {{#each pagedList}}
              <div class="panel panel-clear-style panel-{{getOptimizedKey}} panel_with_component inner-b-0" data-component-key="{{getOptimizedKey}}">
                <div class="pull-right">
                  <div class="cleared-padding">
                    <label>
                      <input type="checkbox" class="on_update_complete" value="true" disabled={{reportDisabled}}
                        {{isCompleted}}>
                      cleared
                    </label>
                  </div>
                </div>
                <div class="panel-heading expand_table pointer">
                  <div>
                    <div class="pull-left expand-table" style="width: 35px;">
                      <i class="fa fa-fw fa-chevron-right show_hide "></i>
                    </div>
                    <div class="licenseName">
                      <h4>{{name}}{{#if version}} <span class="version">({{version}})</span>{{/if}}</h4>
                    </div>
                  </div>
                </div>
                {{#if showDetails}}
                  <div class="panel-body collapsed">
                    <div class="clearfix">
                      <form class="form edit_component">
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="name">Name</label>
                          <input type="text" name="name" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter name" value="{{getField 'name'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="version">Version</label>
                          <input type="text" name="version" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter version" value="{{getField 'version'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="copyrightText">Copyright</label>
                          <input type="text" name="copyrightText" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter copyright" value="{{getField 'copyrightText'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="licenseKey">License key</label>
                          <input type="text" name="licenseKey" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter license key" value="{{getField 'licenseKey'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="license">License name</label>
                          <input type="text" name="license" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter license name" value="{{getField 'license'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="summary">Summary</label>
                          <input type="text" name="summary" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter summary" value="{{getField 'summary'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="packageFileName">Package file name</label>
                          <input type="text" name="packageFileName" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter package file name" value="{{getField 'packageFileName'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="sourceInfo">Source info</label>
                          <input type="text" name="sourceInfo" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter source info" value="{{getField 'sourceInfo'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="originator">Originator</label>
                          <input type="text" name="originator" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter originator" value="{{getField 'originator'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="supplier">Supplier</label>
                          <input type="text" name="supplier" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter supplier" value="{{getField 'supplier'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="downloadLocation">Download location</label>
                          <input type="text" name="downloadLocation" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter download location" value="{{getField 'downloadLocation'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="hashOfExecutable">Hash of executable</label>
                          <input type="text" name="hashOfExecutable" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter hash of executable" value="{{getField 'hashOfExecutable'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="homepageUrl">Homepage url</label>
                          <input type="text" name="homepageUrl" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter homepage url" value="{{getField 'homepageUrl'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="repoUrl">Repo url</label>
                          <input type="text" name="repoUrl" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter repo url" value="{{getField 'repoUrl'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="sourceUrl">Source url</label>
                          <input type="text" name="sourceUrl" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter source url" value="{{getField 'sourceUrl'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="hashOfSource">Hash of source</label>
                          <input type="text" name="hashOfSource" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter hash of source" value="{{getField 'hashOfSource'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="binaryUrl">Binary url</label>
                          <input type="text" name="binaryUrl" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter binary url" value="{{getField 'binaryUrl'}}">
                        </div>
                        <div class="form-group inner-b-5">
                          <label class="control-label" for="other">Other</label>
                          <input type="text" name="other" class="form-control" disabled={{reportDisabled}}
                                 placeholder="Enter other information" value="{{getField 'other'}}">
                        </div>
                        <button class="btn btn-primary save_component" type="button" disabled={{reportDisabled}}>Save component</button>
                      </form>
                    </div>
                  </div>
                {{/if}}
              </div>
            {{/each}}
          {{else}}
            {{> reactiveTableNoData}}
          {{/if}}
        </div>
        {{#with paginationInfo}}
          <div class="reactive-table-navigation">
            <div class="form-inline form-group rows-per-page">
              <label>
                <span>Show</span>
                <span class="form-control">{{pageSize}}</span>
                <span>of</span>
                <span class="rows-per-page-count">{{total}}</span>
                <span>rows per page</span>
              </label>
            </div>
            <div class="form-inline form-group page-number">
              {{#if hasPrev}}
                <i class="previous-page fa fa-caret-left sbom-page-prev"></i>
              {{/if}}
              <label>
                <span>Page</span>
                <input class="form-control sbom-page-input" type="text" value="{{currentDisplay}}">
                <span>of</span>
                <span class="page-number-count">{{totalPages}}</span>
              </label>
              {{#if hasNext}}
                <i class="next-page fa fa-caret-right sbom-page-next"></i>
              {{/if}}
            </div>
          </div>
        {{/with}}
    </div>
    <div class="col-md-4">
      <div class="sbom-view-right">
        <div class="notice-view-right-stats">
          <div class="sbom-stats-row">
            <div class="sbom-stats-left">
              <h3 class="inner-t-0 inner-b-0">TODOs Navigator</h3>
              <button class="btn btn-default btn-xs change_view">
                {{#if showAll}}
                  <span class="fa fa-circle-o"></span> ToDo's
                {{else}}
                  <span class="fa fa-list-ul"></span> Show all
                {{/if}}
              </button>
              <div class="sbom-stats-counters">
                <div class="sbom-stats-counter">
                  <p class="todo-counters-number"><strong>{{components}}</strong></p>
                  <p class="todo-counters-text"><small>components</small></p>
                </div>
                <div class="sbom-stats-counter">
                  <p class="todo-counters-number"><strong>{{todosRemaining}}</strong></p>
                  <p class="todo-counters-text"><small>ToDos remaining</small></p>
                </div>
              </div>
            </div>
            <div class="sbom-stats-chart">
              <div id="chart-progress-modules"></div>
              <small class="text-muted">{{completed}}%</small>
            </div>
          </div>
        </div>
          <div class="notice-view-right-scroll">
            {{#each list}}
              <div class="panel panel-clear-style panel-{{getOptimizedKey}} {{visibilityClass}} panel_with_component inner-b-0" data-component-key="{{getOptimizedKey}}">
                <div class="panel-heading">
                  <div class="pull-right">
                    <div class="inner-l-5 inner-t-5">
                      <a title="Scroll to" href class="scroll_to_section hover-highlight fa fa-link"></a>
                    </div>
                  </div>
                  <div class="hover-highlight" style="max-width: 90%;">
                    <label title="Cleared" class="w100 inner-0">
                      <input type="checkbox" class="on_update_complete" value="true" disabled={{reportDisabled}}
                        {{isCompleted}}>
                      <span class="label-text-span truncate" title="{{name}}">
                          {{name}}</span>
                    </label>
                  </div>
                </div>
              </div>
            {{/each}}
          </div>
        </div>
      </div>
    </div>
</template>

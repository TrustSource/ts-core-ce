<template name="reportTfs">
  <div class="content">
    {{#if getProjectTfsTasks}}
      {{#if getProjectTfsTasksStatus}}
        <div class="inner-b-20 clearfix">
          {{#each getStatusStats}}
            <div class="aui-lozenge text-center"
                 style="width:{{getWidthOfStatus getStatusStats}}%;float:left;background-color:{{color}};border-color:{{color}};color:#fff;">
              <p class="h2"><strong>{{count}}</strong></p>
              <p>{{key}}</p>
            </div>
          {{/each}}
        </div>
        <div class="ts-panel obligation-list">
          {{#each getProjectTfsTasksStatus}}
            <div class="panel-body ">
              <div class="pull-left text-left">
                <div class="label aui-lozenge" style="background-color:{{getStateColor}};border-color:{{getStateColor}};color:#fff">{{getState}}</div>
                <h5>{{id}} <a class="fa fa-external-link" href="{{boardUrl}}" target="_blank"></a></h5>
                <h6>{{getTitle}}</h6>
                <small>Created: {{getCreatedDate}} by {{getCreatedBy}}</small>
              </div>
              <div class="pull-right">
                <div style="width: 500px;min-height: 70px">
                  {{getDescription}}
                </div>
              </div>
            </div>
          {{/each}}
        </div>
      {{/if}}
    {{/if}}
    {{#if selectProject}}
      {{#panel}}
        <div class="text-info">
          <i class="fa fa-check-circle-o"></i> Please select the project to run a report on the upper right
        </div>
      {{/panel}}
    {{/if}}
    {{#if requestInProgress}}
      {{#panel}}
        <div class="text-primary">
          <i class="fa fa-spinner fa-spin"></i> Loading report data for project {{getProjectName}}, please wait...
        </div>
      {{/panel}}
    {{/if}}
    {{#if noDataInProject}}
      {{> reactiveTableNoData}}
    {{/if}}
    {{#if noConnection}}
      {{#panel}}
        <div class="text-warning">
          <i class="fa fa-exclamation-circle"></i> Sorry, but for the selected project {{getProjectName}} request was not successful. 
          <a href="{{pathFor route='companyIntegrations'}}">
            <i class="fa fa-cog"></i> Change integration settings
          </a>
        </div>
      {{/panel}}
    {{/if}}
  </div>
</template>

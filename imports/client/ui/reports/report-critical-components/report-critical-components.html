<template name="reportCriticalComponents">

  {{#pageHeader}}
    <div class="reports-header">
      <div class="reports-header-left">
        <h2 class="font-light m-b-xs">Components</h2>
        <small>List of components with missing data</small>
      </div>
      <div class="reports-header-actions">
        <select class="form-control current-project select2">
          {{#each projectList}}
            <option value="{{_id}}" selected="{{isActiveProject}}">{{name}}</option>
          {{/each}}
        </select>
      </div>
    </div>
  {{/pageHeader}}
  <div class="content">
    {{#if getProjectStats}}
      {{#with getProjectStats}}
        <div class="row">
          {{#if selectedModule}}
            <div class="col-sm-6">
              <div class="panel panel-default text-center">
                <p class="h2"><strong>{{modules}}</strong></p>
                <p class="h5">modules</p>
              </div>
            </div>
          {{/if}}
          <div class="{{#if selectedModule}}col-sm-6{{else}}col-sm-12{{/if}}">
            <div class="panel panel-success text-center">
              <p class="h2"><strong>{{components}}</strong></p>
              <p class="h5">critical components</p>
            </div>
          </div>
        </div>
      {{/with  }}
    {{/if}}
    {{#if getProjectData}}
      <div class="ts-panel obligation-list">
        {{#each getProjectData}}
          <div class="panel-body pinner-tb-10">
            <div class="row">
              <div class="col-sm-12 index-padding text-left">
                <div class="index-box">
                  {{incIndex @index}}
                </div>
                <h5><a target="_blank" href="{{pathFor route='reportCriticalComponentsDetailsEdit' params=getOptions}}"><i class="fa fa-external-link" style="width: 20px; text-align: center"></i> {{name}}</a></h5>
              </div>
            </div>
          </div>
        {{/each}}
      </div>
    {{/if}}
    {{#if selectProject}}
      {{#panel}}
        <div class="text-info">
          <i class="fa fa-check-circle-o"></i> Please select the project to run a report on the upper right
        </div>
      {{/panel}}
    {{/if}}
    {{#if requestInProgress}}
      {{#panel}}
        <div class="text-primary">
          <i class="fa fa-spinner fa-spin"></i> Loading report data for project {{getProjectName}}, please wait...
        </div>
      {{/panel}}
    {{/if}}
    {{#if noDataInProject}}
      <div class="text-right inner-b-10">
        <button class="btn btn-primary btn-xs export-as-pdf" type="button">
          <span class="fa fa-file-pdf-o" aria-hidden="true"></span> Export as PDF
        </button>
      </div>
      {{> reactiveTableNoData}}
    {{/if}}
  </div>
</template>

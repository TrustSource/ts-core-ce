<template name="reportModification">

  {{#pageHeader}}
    <div class="reports-header">
      <div class="reports-header-left">
        <h2 class="font-light m-b-xs">Projects modification state</h2>
        <small>List of all modified components</small>
      </div>
      <div class="reports-header-actions">
        <select class="form-control current-project select2">
          {{#each projectList}}
            <option value="{{_id}}" selected="{{isActiveProject}}">{{name}}</option>
          {{/each}}
        </select>
      </div>
    </div>
  {{/pageHeader}}

  <div class="content">
		{{#if getProjectModification}}
			<div class="text-right inner-b-10">
				<button class="btn btn-primary btn-xs export-as-pdf" type="button">
					<span class="fa fa-file-pdf-o" aria-hidden="true"></span> Export as PDF
				</button>
			</div>
			<div class="row">
				<div class="col-sm-3">
					<div class="panel panel-success text-center">
						<p class="h2"><strong>{{counterComponentsTotal}}</strong></p>
						<p class="h5">different components</p>
					</div>
				</div>
				<div class="col-sm-3">
					<div class="panel panel-default text-center">
						<p class="h2"><strong>{{counterModules}}</strong></p>
						<p class="h5">modules</p>
					</div>
				</div>
				<div class="col-sm-3">
					<div class="panel panel-danger text-center">
						<p class="h2"><strong>{{counterModified}}</strong></p>
						<p class="h5">modified appearances</p>
					</div>
				</div>
				<div class="col-sm-3">
					<div class="panel panel-danger text-center">
						<p class="h2"><strong>{{counterUndocumentedChanges}}</strong></p>
						<p class="h5">undocumented changes</p>
					</div>
				</div>
			</div>
			{{#with getProjectModificationStatus}}
				{{#if modules.length}}
					<div class="panel panel-default">
						<div class="panel-heading">
							<h5>Used modules</h5>
						</div>
						<div class="panel-body">
							{{#each modules}}
								{{> moduleAnalysisMetaLink module=this}}
							{{/each}}
						</div>
					</div>
				{{/if}}
			{{/with}}
			<div class="ts-panel obligation-list">
				{{#each getProjectModification}}
					<div class="panel-body {{status}}">
						<div class="row">
							<div class="col-sm-4 text-left">
								<h5 style="word-wrap: break-word;">{{key}} ({{versions}})</h5>
								<small>{{getPluralized 'appearance' countPath}}</small>
							</div>
							<div class="col-sm-8">
								<div style="font-size: 0.7em;margin-top:5px;">
									{{#each paths}}
										<p style="font-weight: bold">
											<a href="{{pathFor route=actionRoute.route data=actionRoute.params query=actionRoute.query}}"
												 target="_blank">
												{{path}}
												<span class="fa fa-external-link inner-l-5"></span>
											</a>
										</p>
										<p>
											{{#if changesUrl}}
												List of changes can be found <a class="highlight" target="_blank" href="{{changesUrl}}">here</a>
											{{else}}
												Changes url has not been provided
											{{/if}}
										</p>
										<p class="m-b-md">
											{{#if changesText}}
												Modification notice: {{changesText}}
											{{else}}
												Modification notice has not been provided
											{{/if}}
										</p>
									{{/each}}
								</div>
							</div>
						</div>
					</div>
				{{/each}}
			</div>
		{{/if}}
    {{#if selectProject}}
      {{#panel}}
        <div class="text-info">
          <i class="fa fa-check-circle-o"></i> Please select the project to run a report on the upper right
        </div>
      {{/panel}}
    {{/if}}
    {{#if requestInProgress}}
      {{#panel}}
        <div class="text-primary">
          <i class="fa fa-spinner fa-spin"></i> Loading report data for project {{getProjectName}}, please wait...
        </div>
      {{/panel}}
    {{/if}}
    {{#if noDataInProject}}
      <div class="text-right inner-b-10">
        <button class="btn btn-primary btn-xs export-as-pdf" type="button">
          <span class="fa fa-file-pdf-o" aria-hidden="true"></span> Export as PDF
        </button>
      </div>
      {{> reactiveTableNoData}}
    {{/if}}
  </div>
</template>

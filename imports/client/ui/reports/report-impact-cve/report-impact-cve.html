<template name="reportImpactCve">

  {{# pageHeader title="CVE impact report" desc="List of all projects impacted by CVE ID"  }}{{/pageHeader}}

  <div class="content pinner-t-5">
    <div class="panel-heading actions no-top clearfix">
      <form class="pull-left form-inline" id="cveImpactForm">
        <div class="form-group">
          <h5 class="inner-r-10"><strong class="fa fa-filter"></strong></h5>
        </div>
        <div class="form-group" style="width:400px;">
          <input class="form-control w100i" name="currentCve" type="text"
                 placeholder="You may use syntax like CVE-2021-25322" autocomplete="off" spellcheck="off">
        </div>
        <button class="btn btn-primary check_for" title="Check component" type="submit">
          <i class="fa fa-play"></i> Check
        </button>
        <button class="btn btn-default reset_view" title="Reset filters" type="button">
          <i class="fa fa-trash"></i>
        </button>
      </form>
    </div>
    {{#if beforeRequest}}
      <div class="panel panel-default">
        <div class="panel-heading">
          <h3 class="panel-title">Please specify CVE</h3>
        </div>
        <div class="panel-body">
          <p>CVE ID is required to execute check in your portfolio</p>
        </div>
      </div>
    {{else}}
      {{#if requestInProgress}}
        {{#panel}}
          <div class="text-primary">
            <i class="fa fa-spinner fa-spin"></i> Loading report data for {{#with currentCve}}{{this}}{{/with}}, please
            wait...
          </div>
        {{/panel}}
      {{else}}
        {{#with cveDetails}}
          {{#if getScore}}
            <div>
              {{#panel title="CVE description"}}
                <a target="_blank" href="{{getLink}}">
                  {{#if getCisa}}
                    {{#with getCisa}}
                      <span class="inline-block m-r-xs cisa-icon fa fa-user-secret text-violations" title="CISA Exploit alert! Added: {{dateAdded}}, Required action: {{requiredAction}}"></span>
                    {{/with}}
                  {{/if}}
                  {{{cvssLabelCompact getScore getCVSSColor getScore}}}
                  <span class="inline-block m-l-xs">{{getName}}</span>
                  {{#if getLink}}
                    <span class="fa fa-external-link icon-inner-top"></span>
                  {{/if}}
                </a>
                {{#if getBumpHints}}
                  <span class="inline-block bump-icon fa fa-level-up" title="Bump hints"></span>
                  {{#each getBumpHints}}
                    <span class="label label-default">{{this}}</span>
                  {{/each}}
                {{/if}}
                {{#if getLastModified}}
                  <p class="inner-b-0" title="Last modified">
                    <span class="fa fa-clock-o"></span> {{{dateFromNow getLastModified}}}
                  </p>
                {{/if}}
                <p class="inner-b-0">
                  {{#if getWeakness}}
                    <span title="Weakness"><a href="{{getWeaknessUrl}}" target="_blank" title="{{ getWeakness }}">{{ getWeakness }} <span class="fa fa-external-link"></span></a></span> -
                  {{/if}}
                  {{#if getVector}}
                    , <span class="truncate" title="Base Score (vectoral): {{ getVector }}">{{ getVector }}</span>
                  {{/if}}
                  {{#if getExploitscore}}
                    , <span title="Exploit score: {{ getExploitscore }}">Exploit: {{ getExploitscore }}</span>
                  {{/if}}
                  {{#if getImpactscore}}
                    , <span title="Impact score: {{ getImpactscore }}">Impact: {{ getImpactscore }}</span>
                  {{/if}}
                </p>
                <p class="inner-b-0">{{getDescription}}</p>
              {{/panel}}
            </div>
          {{/if}}
        {{/with}}
        {{#if getProject}}
          <div class="text-right inner-b-10">
            <button class="btn btn-default btn-xs send_alert" title="Send alert" type="button">
              <i class="fa fa-bell-o"></i> Send alert
            </button>
            <button class="btn btn-primary btn-xs export-as-pdf" type="button">
              <span class="fa fa-file-pdf-o" aria-hidden="true"></span> Export as PDF
            </button>
          </div>
          <div class="ts-panel obligation-list">
            {{#each getProject}}
              <div class="panel-body">
                <div class="row">
                  <div class="col-sm-6 text-left">
                    <h4 style="word-wrap: break-word;" class="inner-t-0">
                      <a href="{{pathFor route=actionRoute.route data=actionRoute.params}}"
                         target="_blank">
                        {{name}}
                        <span class="fa fa-external-link inner-l-5"></span>
                      </a>
                    </h4>
                    {{#with relatedUsers.defaultProjectManager.profile}}
                      <p class="inner-b-5">
                        Project manager: {{name}}
                        <a href="mailto:{{email}}" target="_blank">{{email}} <span class="fa fa-external-link inner-l-5"></span></a>
                      </p>
                    {{/with}}
                    {{#with relatedUsers.defaultComplianceManager.profile}}
                      <p class="inner-b-5">
                        Compliance manager: {{name}}
                        <a href="mailto:{{email}}" target="_blank">{{email}} <span class="fa fa-external-link inner-l-5"></span></a>
                      </p>
                    {{/with}}
                  </div>
                  <div class="col-sm-6">
                    <p>
                      {{#unless isUnasigned}}
                        {{#if haveDescription description}}
                          <p>{{description}}</p>
                        {{else}}
                          <p>No goals mentioned in project settings.</p>
                        {{/if}}
                      {{/unless}}
                    </p>
                  </div>
                </div>
                {{#each modules}}
                  <div class="row">
                    <div class="col-md-6">
                      {{> moduleAnalysisMetaLink module=this}}
                    </div>
                    <div class="col-md-6">
                      {{#each cveConfig}}
                        <p class="m-b-none">- {{comment}}</p>
                      {{/each}}
                    </div>
                  </div>
                {{/each}}
              </div>
            {{/each}}
          </div>
        {{else}}
          <div class="panel panel-success">
            <div class="panel-heading">
              <h3 class="panel-title">No impact</h3>
            </div>
            <div class="panel-body">
              <p>No projects or modules are impacted by {{#with currentCve}}{{this}}{{/with}}</p>
            </div>
          </div>
        {{/if}}
      {{/if}}
    {{/if}}
  </div>
</template>

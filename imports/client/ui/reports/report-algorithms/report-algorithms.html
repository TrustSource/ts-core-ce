<template name="reportAlgorithms">

  {{#pageHeader}}
    <div class="reports-header">
      <div class="reports-header-left">
        <h2 class="font-light m-b-xs">Algorithms overview</h2>
        <small>Overview of all component algorithms</small>
      </div>
      <div class="reports-header-actions">
        <select class="form-control current-project select2">
          {{#each projectList}}
            <option value="{{_id}}" selected="{{isActiveProject}}">{{name}}</option>
          {{/each}}
        </select>
      </div>
    </div>
  {{/pageHeader}}

  <div class="content">
    {{#if getProjectVersioning}}
      <div class="text-right inner-b-10">
        <button class="btn btn-primary btn-xs export-as-pdf" type="button">
          <span class="fa fa-file-pdf-o" aria-hidden="true"></span> Export as PDF
        </button>
      </div>
      <div class="row">
        <div class="col-sm-6">
          <div class="panel panel-default text-center">
            <p class="h2"><strong>{{counterModules}}</strong></p>
            <p class="h5">modules</p>
          </div>
        </div>
        <div class="col-sm-6">
          <div class="panel panel-danger text-center">
            <p class="h2"><strong>{{counterComponents}}</strong></p>
            <p class="h5">components with algorithms</p>
          </div>
        </div>
      </div>
      {{#with getProjectVersioningStatus}}
        {{#if modules.length}}
          <div class="panel panel-default">
            <div class="panel-heading">
              <h5>Used modules</h5>
            </div>
            <div class="panel-body">
              {{#each modules}}
                {{> moduleAnalysisMetaLink module=this}}
              {{/each}}
            </div>
          </div>
        {{/if}}
      {{/with}}
      <div class="ts-panel obligation-list">
        {{#each getProjectVersioning}}
          <div class="panel-body {{status}}">
            <div class="row">
              <div class="col-sm-6 text-left">
                <h5 style="word-wrap: break-word;">{{key}}</h5>
                <div style="font-size: 0.7em;margin-top:5px">
                  <p>
                    <a href="{{pathFor route=actionRoute.route data=actionRoute.params query=actionRoute.query}}"
                       target="_blank">
                      {{moduleName}}
                      <span class="fa fa-external-link inner-l-5"></span>
                    </a>
                  </p>
                </div>
              </div>
              <div class="col-sm-6">
                {{#each crypto_algorithms}}
                  <span class="label label-default">{{#if isDenied}}
                    <div class="label label-danger blacklisted-algorithm-label" title="Algorithm is Blacklisted by Company policy">B</div>
                  {{/if}} {{algorithm}} [{{strength}}]</span>
                {{/each}}
              </div>
            </div>
          </div>
        {{/each}}
      </div>
    {{/if}}
    {{#if selectProject}}
      {{#panel}}
        <div class="text-info">
          <i class="fa fa-check-circle-o"></i> Please select the project to run a report on the upper right
        </div>
      {{/panel}}
    {{/if}}
    {{#if requestInProgress}}
      {{#panel}}
        <div class="text-primary">
          <i class="fa fa-spinner fa-spin"></i> Loading report data for project {{getProjectName}}, please wait...
        </div>
      {{/panel}}
    {{/if}}
    {{#if noDataInProject}}
      <div class="text-right inner-b-10">
        <button class="btn btn-primary btn-xs export-as-pdf" type="button">
          <span class="fa fa-file-pdf-o" aria-hidden="true"></span> Export as PDF
        </button>
      </div>
      {{> reactiveTableNoData}}
    {{/if}}
  </div>
</template>

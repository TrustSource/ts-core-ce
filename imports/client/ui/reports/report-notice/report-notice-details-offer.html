<template name="noticeFileDetailsOffer">
  <a title="Change Written Offer" href aria-hidden="true" class="hover-highlight fa fa-pencil"
     data-toggle="modal" data-target="#reportNoticeOffer"></a>
  <!-- Modal: reportNoticeOffer -->
  <div class="modal fade" id="reportNoticeOffer" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <i class="fa fa-pencil ts-big-icon text-success"></i>
          <br/>
          <h4 class="modal-title">Change Written Offer</h4>
        </div>
        <form id="reportNoticeOfferForm">
          <div class="modal-body">
            <div class="row">
              <div class="form-group col-xs-12">
                <label for="writtenOfferTitle">Title</label>
                <input class="form-control" value="{{writtenOffer.title}}" type="text"
                       id="writtenOfferTitle" name="writtenOfferTitle">
              </div>
              <div class="form-group col-xs-12">
                <label for="writtenOfferDescription">Description</label>
                <textarea class="form-control" id="writtenOfferDescription" rows="7"
                          name="writtenOfferDescription">{{writtenOffer.description}}</textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

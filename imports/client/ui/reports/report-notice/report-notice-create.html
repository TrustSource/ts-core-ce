<template name="reportNoticeFileCreate">
  <a class="btn btn-primary btn-xs" data-toggle="modal" data-target="#createNoticeFile">
    <span class="fa fa-plus-circle" aria-hidden="true"></span> Create notice file</a>

  <!-- Modal: createNoticeFile -->
  <div class="modal fade" id="createNoticeFile" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <i class="fa fa-paragraph-icon ts-big-icon text-success"></i>
          <br/>
          <h4 class="modal-title">Create notice file</h4>
          <br/>
          <div class="{{createNoticeFileMsgType}}"
               id="form-messages">{{createNoticeFileMsg}}</div>
        </div>
        <form id="createNoticeFileForm">
          <div class="modal-body">
            <div class="row">
              <div class="form-group col-xs-12">
                <label for="noticeFileProjectModule">Project or module *</label>
                <select class="form-control select2" id="noticeFileProjectModule" name="noticeFileProjectModule">
                  <option value="">--Select one--</option>
                  {{#each projectList}}
                    <optgroup label="{{name}}">
                      <option value="{{_id}}" selected="{{isActiveProject}}">All module of {{name}}</option>
                      {{#each listModules}}
                        <option value="{{../_id}}_m_{{_id}}" selected="{{isActiveModule}}">{{name}}</option>
                      {{/each}}
                    </optgroup>
                  {{/each}}
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close
            </button>
            {{#if loading}}
              <button type="button" disabled class="btn btn-primary">
                <i class="fa fa-spinner fa-spin"></i> Creating...
              </button>
            {{else}}
              <button type="submit" class="btn btn-primary">Create notice file</button>
            {{/if}}
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

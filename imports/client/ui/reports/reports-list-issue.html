<template name="reportsListIssue">
  <div class="col-md-3 col-sm-6">
    <div class="panel panel-default">
      <a href="{{pathFor route='reportIssue'}}">
        <div class="panel-body">
          <div class="row">
            <div class="col-md-12">
              <span class="integration-icon issue-highlighted ts-big-icon"></span>
            </div>
            <div class="col-md-12">
              <h4 style="margin: 10px 0 20px">
                Issue report
              </h4>
            </div>
            <div class="col-md-12">
              <p>Status of all issues</p>
            </div>
          </div>
        </div>
      </a>
    </div>
  </div>
</template>

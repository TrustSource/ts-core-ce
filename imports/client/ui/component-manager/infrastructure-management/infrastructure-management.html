<template name="infrastructureManagement">

  {{#pageHeader}}
    <div class="approves-detail-header">
      <div class="approves-detail-header-left">
        <h2 class="font-light m-b-none">Infrastructure Components</h2>
        <small class="text-muted">Components used as Modules</small>
      </div>
      <div class="approves-detail-header-actions">
        <a href="{{pathFor route='infrastructureComponentsList'}}" class="btn btn-default">
          <i class="fa fa-arrow-left"></i> Back to list
        </a>
      </div>
    </div>
  {{/pageHeader}}
  <div class="content">
    <div class="row scans">
        {{#if this.length}}
          <div class="col-lg-12 ts-stagger-item ecs-components fadeIn">
            <div class="ts-panel">
              {{#each this}}
                <div class="panel-body component-list pinner-5i">
                  <div class="col-md-6 truncate">
                    <h4>{{getName}}</h4>
                  </div>
                  <div class="col-md-5">{{getVersion}}</div>
                </div>
              {{/each}}
            </div>
          </div>
        {{else}}
          {{> reactiveTableNoData}}
        {{/if}}
    </div>
  </div>
</template>

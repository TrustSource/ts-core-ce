<template name="cotsManagementComponentCreate">
  <a class="btn btn-primary btn-xs" data-toggle="modal" data-target="#createCOTSModule">
    <span class="fa fa-puzzle-piece" aria-hidden="true"></span> Add COTS component</a>

  <!-- Modal: createCOTSModule -->
  <div class="modal fade" id="createCOTSModule" tabindex="-1" role="dialog"
       aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <i class="fa fa-puzzle-piece ts-big-icon text-success"></i>
          <br/>
          <h4 class="modal-title">Add COTS component</h4>
          <br/>
          <div class="{{createCOTSModuleMsgType}}"
               id="form-messages">{{createCOTSModuleMsg}}</div>
        </div>
        <form id="createCOTSModuleForm">
          <div class="modal-body">
            <div class="row">
              <div class="form-group col-xs-6">
                <label for="componentName">Name *</label>
                <input type="text" value="" id="componentName" class="form-control"
                       name="componentName">
                <span class="help-block small">Specify the name of the new component</span>
              </div>
              <div class="form-group col-xs-6">
                <label for="componentKey">Key</label>
                <input type="text" value="" id="componentKey" class="form-control"
                       name="componentKey">
                <span class="help-block small">Specify the key of the new component aka im:mysql</span>
              </div>
              <div class="form-group col-xs-12">
                <label for="componentVersions">Versions</label>
                <input type="text" value="" id="componentVersions" class="form-control"
                       name="componentVersions">
                <span class="help-block small">Specify the versions of the component, separated by comma</span>
              </div>
              <div class="form-group col-xs-6">
                <label for="componentHomepage">Homepage</label>
                <input type="text" value="" id="componentHomepage" class="form-control"
                       name="componentHomepage">
                <span class="help-block small">Specify the homepage of the component</span>
              </div>
              <div class="form-group col-xs-6">
                <label for="componentRepository">Repository</label>
                <input type="text" value="" id="componentRepository" class="form-control"
                       name="componentRepository">
                <span class="help-block small">Specify the repository of the component</span>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary">Create component</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

<template name="cotsManagementComponentsEdit">

  {{#if isComponentLoaded}}
  {{> cotsManagementComponentsHeader}}

  <div class="content component-detail">
    <div class="row">
      <div class="col-md-12">
        <div class="panel" id="info-panel">
          <div class="panel-heading">
            <h4 class="inner-b-0">
              Information
            </h4>
          </div>
          <div class="panel-body">
            <div class="row">
              <div class="col-md-12">

                <div class="form-horizontal">
                  <div class="form-group">
                    <label class="col-sm-2 control-label">Key</label>
                    <div class="col-sm-8 pinner-t-8">
                      {{getKey}}
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label">purl (package URL)</label>
                    <div class="col-sm-8 pinner-t-8">
                      {{getPackageUrl}}
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label">Category</label>
                    <div class="col-sm-8">
                      {{> tagInput categorySettings}}
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label" for="homepage">Homepage</label>
                    <div class="col-sm-8">
                      <input type="text" id="homepage" class="form-control"
                             placeholder="Enter homepage: http://project.home.com/homepage"
                             value="{{getUrl 'homepage'}}">
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label" for="repository">Repository</label>
                    <div class="col-sm-8">
                      <input type="text" id="repository" class="form-control"
                             placeholder="Enter repository: git://project.home.com/repo"
                             value="{{getUrl 'repository'}}">
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label" for="issues">Issues</label>
                    <div class="col-sm-8">
                      <input type="text" id="issues" class="form-control"
                             placeholder="Enter issues page: http://project.home.com/issues"
                             value="{{getUrl 'issues'}}">
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label" for="notes">Release notes</label>
                    <div class="col-sm-8">
                      <input type="text" id="notes" class="form-control"
                             placeholder="Enter release notes page: http://project.home.com/notes"
                             value="{{getUrl 'notes'}}">
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label" for="provider">Provider</label>
                    <div class="col-sm-8">
                      <input type="text" id="provider" class="form-control"
                             placeholder="Enter provider company, e.g. Oracle Inc."
                             value="{{getField 'provider'}}">
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label" for="providerUrl">Provider url</label>
                    <div class="col-sm-8">
                      <input type="text" id="providerUrl" class="form-control"
                             placeholder="Enter link to a provider homepage, e.g. https://www.oracle.com"
                             value="{{getField 'providerUrl'}}">
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label" for="providerAddress">Provider address</label>
                    <div class="col-sm-8">
                      <input type="text" id="providerAddress" class="form-control"
                             placeholder="Enter provider contact address, e.g. Somewhere City, 6328 OldTownBoulevard, Cleveland 3"
                             value="{{getField 'providerAddress'}}">
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label" for="licenseModel">License model</label>
                    <div class="col-sm-8">
                      <div class="radio-inline">
                        <label>
                          <input type="radio" name="licenseModel" value="SEAT_BASED"
                                 checked="{{equals getField 'licenseModel' 'SEAT_BASED'}}">
                          Seat based
                        </label>
                      </div>
                      <div class="radio-inline">
                        <label>
                          <input type="radio" name="licenseModel" value="INSTALL_BASED"
                                 checked="{{equals getField 'licenseModel' 'INSTALL_BASED'}}">
                          Install based
                        </label>
                      </div>
                      <div class="radio-inline">
                        <label>
                          <input type="radio" name="licenseModel" value="FLAT"
                                 checked="{{equals getField 'licenseModel' 'FLAT'}}">
                          Flat
                        </label>
                      </div>
                      <div class="radio-inline">
                        <label>
                          <input type="radio" name="licenseModel" value="OTHER"
                                 checked="{{equals getField 'licenseModel' 'OTHER'}}">
                          Other
                        </label>
                      </div>
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label" for="optionsLang">Language</label>
                    <div class="col-sm-8">
                      <div class="radio-inline">
                        <label>
                          <input type="radio" name="optionsLang" value="unknown"
                                 checked="{{equals getLanguage 'unknown'}}">
                          unknown
                        </label>
                      </div>
                      {{#each allowedLanguages}}
                        <div class="radio-inline">
                          <label>
                            <input type="radio" name="optionsLang" value="{{this}}"
                                   checked="{{equals ../getLanguage this}}">
                            {{this}}
                          </label>
                        </div>
                      {{/each}}
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label">Crypto algorithms</label>
                    <div class="col-sm-8">
                      <ul class="pinner-l-20 inner-b-0">
                        {{#each cryptoAlgorithmsListHtml getAlgorithms}}
                          <li>{{algorithm}} {{strength}}</li>
                        {{/each}}
                      </ul>
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label">AI / ML models</label>
                    <div class="col-sm-8">
                      <ul class="pinner-l-20 inner-b-0">
                        {{#each getAiModels}}
                          <li>{{name}}{{#if version}} {{version}}{{/if}}{{#if provider}} · {{provider}}{{/if}}{{#if task}} · {{task}}{{/if}}</li>
                        {{/each}}
                      </ul>
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label">Declared licenses</label>
                    <div class="col-sm-8">
                      <select id="set-declared-licenses" class="form-control set-declared-licenses select2"
                              multiple="multiple">
                        {{#each getDeclaredLicensesList}}
                          <option value="{{key}}" selected="{{selected}}" title="{{name}}">{{name}}</option>
                        {{/each}}
                      </select>
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label">Effective licenses</label>
                    <div class="col-sm-8">
                      <select id="set-effective-licenses" class="form-control set-effective-licenses select2"
                              multiple="multiple">
                        {{#each getEffectiveLicensesList}}
                          <option value="{{key}}" selected="{{selected}}" title="{{name}}">{{name}}</option>
                        {{/each}}
                      </select>
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label">Concluded licenses</label>
                    <div class="col-sm-8">
                      <select id="set-concluded-licenses" class="form-control set-concluded-licenses select2"
                              multiple="multiple">
                        {{#each getConcludedLicensesList}}
                          <option value="{{key}}" selected="{{selected}}" title="{{name}}">{{name}}</option>
                        {{/each}}
                      </select>
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label">Declared copyright</label>
                    <div class="col-sm-8">
            					<textarea name="text" rows="3" class="form-control" id="declaredCopyright"
                                placeholder="Enter declared copyright here">{{getDeclaredCopyright}}</textarea>
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="col-sm-2 control-label">Last Update</label>
                    <div class="col-sm-8 pinner-t-8">
                      {{dateFormat getUpdated}} by {{getUpdatedBy}}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="panel" id="requirements-sw-panel">
          <div class="panel-heading">
            <h4 class="inner-b-0">
              Requirements concerning the software
            </h4>
          </div>
          <div class="panel-body">
            <textarea name="text" rows="3" class="form-control" id="requirements_sw"
                      placeholder="Enter component requirements here">{{getRequirementsSW}}</textarea>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="panel" id="requirements-hw-panel">
          <div class="panel-heading">
            <h4 class="inner-b-0">
              Requirements concerning the hardware
            </h4>
          </div>
          <div class="panel-body">
            <textarea name="text" rows="3" class="form-control" id="requirements_hw"
                      placeholder="Enter component requirements here">{{getRequirementsHW}}</textarea>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="panel" id="description-panel">
          <div class="panel-heading">
            <h4 class="inner-b-0">
              Short description
            </h4>
          </div>
          <div class="panel-body">
            <textarea name="text" rows="3" class="form-control" id="shortDescription"
                      placeholder="Enter component short description here">{{getShortDescription}}</textarea>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="panel" id="description-panel">
          <div class="panel-heading">
            <h4 class="inner-b-0">
              Description
            </h4>
          </div>
          <div class="panel-body">
            <textarea name="text" rows="3" class="form-control" id="description"
                      placeholder="Enter component description here">{{getDescription}}</textarea>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="panel" id="comment-panel">
          <div class="panel-heading">
            <h4 class="inner-b-0">
              Comment
            </h4>
          </div>
          <div class="panel-body">
            <textarea name="text" rows="3" class="form-control" id="comment"
                      placeholder="Enter a comment concerning the component here">{{getCommentForTextArea }}</textarea>
          </div>
        </div>
      </div>
    </div>

    {{> componentCommercialTerms component=this.data collection='cotsComponents'}}

    {{#if getVersions true}}
      <div class="panel component-version">
        <div class="panel-heading">
          <div class="row inner-b-5 bulk_create_versions">
            <div class="col-sm-6">
              <div class="version-heading-left">
                <h4 class="inner-b-0">
                  Versions
                  {{> versionCount filter=versionFilter matched=getVersionsMatching.length total=countVersions}}
                </h4>
                {{> versionSearch filter=versionFilter matched=getVersionsMatching.length
                                  total=countVersions clearsSelection=true}}
              </div>
            </div>
            <div class="col-sm-4">
              <input class="form-control create-versions-list"
                     placeholder="Enter comma separated versions : 1.0.1,2.0.1">
            </div>
            <div class="col-sm-2">
              <button class="btn btn-primary create-versions"
                      type="button">Create versions
              </button>
            </div>
          </div>
        </div>
        <div class="panel-body">
          <div class="row inner-b-5 bulk_update_versions">
            <div class="col-sm-4 select-all-box">
              <label class="checkbox">
                <input type="checkbox" name="selectAll" class="mark-selected-all">
              </label>
              <select id="set-license-to-selected" class="form-control set-license-to-selected select2"
                      multiple="multiple" disabled="{{noSelectedVersions}}">
                {{#each getAllLicenses}}
                  <option value="{{key}}" selected="{{selected}}" title="{{name}}">{{name}}</option>
                {{/each}}
              </select>
            </div>
            <div class="col-sm-3">
              <input class="form-control set-license-url-to-selected" disabled="{{noSelectedVersions}}"
                     placeholder="Enter url for license text: http://project.repo.com/license.md">
            </div>
            <div class="col-sm-3">
              <input class="form-control set-copyright-to-selected" disabled="{{noSelectedVersions}}"
                     placeholder="Enter copyright text for component : Copyright (c) <year> <copyright holders>">
            </div>
            <div class="col-sm-2">
              <button class="btn btn-primary set-changes-to-selected" disabled="{{noSelectedVersions}}"
                      type="button">Set to selected
              </button>
            </div>
          </div>
          <table class="table table-condensed">
            <tbody>
            {{#each getVersionsMatching}}
              {{> componentDetailsVersion}}
            {{/each}}
            </tbody>
          </table>
          {{#unless getVersionsMatching}}
            {{> reactiveTableNoData}}
          {{/unless}}
        </div>
      </div>
    {{/if}}
  </div>
  {{/if}}
</template>

<template name="CapabilitiesEditModal">
  <!-- Modal: CapabilitiesEditModal -->
  <div class="modal fade" id="CapabilitiesEditModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <h4 class="modal-title">Capability</h4>
        </div>
        <form id="CapabilitiesEditForm" method="post">
          {{#with data}}
            <div class="modal-body relative">
              <div class="row">
                <div class="form-group col-sm-6">
                  <label for="name">Name *</label>
                  <input type="text" value="{{name}}" id="name" class="form-control" required disabled="{{isFormDisabled}}"
                         name="name">
                </div>
                <div class="form-group col-sm-6">
                  <label for="version">Introduced at version</label>
                  <input type="text" value="{{version}}" id="version" class="form-control" name="version" disabled="{{isFormDisabled}}">
                </div>
                <div class="form-group col-xs-12">
                  <label for="description">Description</label>
                  <textarea id="description" class="form-control" name="description" disabled="{{isFormDisabled}}">{{description}}</textarea>
                </div>
              </div>
            </div>
          {{/with}}
          <div class="modal-footer">
            <div class="pull-right">
              <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
              {{#if loading}}
                <button type="button" disabled="disabled" class="btn btn-primary">
                  <i class="fa fa-spinner fa-spin"></i> Update
                </button>
              {{else}}
                <button type="submit" class="btn btn-primary" disabled="{{isFormDisabled}}">
                  Update
                </button>
              {{/if}}
            </div>
            <div class="pull-left">
              {{> InlineItemNavigation listVariable='getCapabilitiesList' itemVariable='editCapabilitiesDetails' loadingVariable='loadingInProgress'}}
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

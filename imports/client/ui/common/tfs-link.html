<template name="tfsLink">
  {{#unless noTfs}}
    <div>
      {{#if tfsId}}
        <a class="view-tfs" href="{{tfsApp}}/browse/{{tfsId}}" target="_blank">
          <span class="integration-icon tfs integration-lg "></span> {{tfsTaskStatus}}
        </a>
        <a class="fa fa-remove remove-tfs" role="button" tabindex="0" title="Remove TFS issue" aria-label="Remove TFS issue"></a>
      {{else}}
        <a class="show-tfs-modal" role="button" tabindex="0" aria-label="Create issue in TFS">
          <span class="integration-icon tfs-disabled integration-lg "></span> Create issue
        </a>
        <!-- Modal: createIssue -->
        <div class="modal fade createIssue" tabindex="-1" role="dialog" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="ts-accent-line"></div>
              <div class="modal-header text-center">
                <i class="fa fa-check-square-o ts-big-icon text-success"></i>
                <br/>
                <h4 class="modal-title">Create new TFS issue</h4>
                <br/>
                <div class="{{createIssueMsgType}}" id="form-messages">{{createIssueMsg}}</div>
              </div>
              <form class="createIssueForm">
                <div class="modal-body text-left">
                  <div class="form-group ">
                    <label for="modalTitle">Title</label>
                    <input type="text" value="" id="modalTitle" name="modalTitle" class="form-control">
                    <span class="help-block small">Specify the title of issue</span>
                  </div>
                  <div class="form-group ">
                    <label for="modalDescription">Description</label>
                    <textarea value="" id="modalDescription" name="modalDescription" class="form-control" rows="5"></textarea>
                    <span class="help-block small">Specify the description of issue</span>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                  <button type="submit" class="btn btn-primary create-tfs">Create issue</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      {{/if}}
    </div>
  {{/unless}}
</template>

<template name="CapabilitiesAddModal">
  <!-- Modal: CapabilitiesAddModal -->
  <div class="modal fade" id="CapabilitiesAddModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <h4 class="modal-title">Add Capability</h4>
        </div>
        <form id="CapabilitiesAddForm" method="post">
          <div class="modal-body">
            <div class="row">
              <div class="form-group col-sm-6">
                <label for="name">Name *</label>
                <input type="text" value="" id="name" class="form-control" required
                       name="name">
              </div>
              <div class="form-group col-sm-6">
                <label for="version">Introduced at version</label>
                <input type="text" value="" id="version" class="form-control" name="version">
              </div>
              <div class="form-group col-xs-12">
                <label for="description">Description</label>
                <textarea id="description" class="form-control" name="description"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            {{#if loading}}
              <button type="button" disabled="disabled" class="btn btn-primary">
                <i class="fa fa-spinner fa-spin"></i> Add
              </button>
            {{else}}
              <button type="submit" class="btn btn-primary">
                Add
              </button>
            {{/if}}
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

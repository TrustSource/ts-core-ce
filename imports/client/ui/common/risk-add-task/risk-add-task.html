<template name="riskAddTask">
  <a class="btn btn-primary" data-toggle="modal" data-target="#RiskAddTaskModal" title="Add task">
    <span class="fa fa-plus" aria-hidden="true"></span>
    Add task
  </a>
  <!-- Modal: RiskAddTask -->
  <div class="modal fade" id="RiskAddTaskModal" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <h4 class="modal-title">Add a task</h4>
        </div>
        <form id="RiskAddTaskForm" method="post">
          <div class="modal-body">
            <div class="row">
              <div class="form-group col-xs-12">
                <label for="countermeasure">Countermeasure *</label>
                <select name="countermeasure" id="countermeasure" class="form-control select2" required disabled="{{isFormDisabled}}" tabindex="1">
                  {{#each getCountermeasure}}
                    <option value="{{countermeasure}}">
                      {{countermeasure}}
                    </option>
                  {{/each}}
                </select>
              </div>
              <div class="form-group col-xs-6">
                <label for="task">Name *</label>
                <input type="text" value="" id="task" class="form-control" required tabindex="2"
                       name="task" placeholder="e.g. Verify fix with security test suite">
              </div>
              <div class="form-group col-xs-6">
                <label for="status">Status</label>
                <select name="status" class="form-control select2" id="status" tabindex="3" disabled="{{isFormDisabled}}">
                  {{#each getStatuses}}
                    <option value="{{this}}">
                      {{this}}
                    </option>
                  {{/each}}
                </select>
              </div>
              <div class="form-group col-xs-6">
                <label for="due">Due date</label>
                <input type="date" value="" id="due" class="form-control" tabindex="4"
                       name="due">
              </div>
              <div class="form-group col-xs-6">
                <label for="frequency">Frequency</label>
                <input type="text" value="" id="frequency" class="form-control" tabindex="5"
                       name="frequency" placeholder="e.g. quarterly">
              </div>
              <div class="form-group col-xs-12">
                <label for="comment">Comment</label>
                <textarea type="text" value="" id="comment" class="form-control" tabindex="6"
                       name="comment" placeholder="e.g. Re-check after each release"></textarea>
              </div>
              <div class="form-group col-xs-12">
                <label for="responsible">Responsible</label>
                <select name="responsible" multiple class="form-control select2" id="responsible" tabindex="7" disabled="{{isFormDisabled}}">
                  {{#each getUsers}}
                    <option value="{{value}}">
                      {{label}}
                    </option>
                  {{/each}}
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal" tabindex="10">Close</button>
            {{#if loading}}
              <button type="button" disabled="disabled" class="btn btn-primary" tabindex="8">
                <i class="fa fa-spinner fa-spin"></i> Save
              </button>
              <button type="button" disabled="disabled" class="btn btn-primary" tabindex="9">
                <i class="fa fa-spinner fa-spin"></i> Save and Create new one
              </button>
            {{else}}
              <button type="submit" class="btn btn-primary without_next" tabindex="8">
                Save
              </button>
              <button type="submit" class="btn btn-primary with_next" tabindex="9">
                Save and Create new one
              </button>
            {{/if}}
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

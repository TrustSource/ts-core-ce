<template name="paginationList">
  {{#if collection}}
    <div class="panel-footer pagination-full">
      <div class="pull-right">
        <ul class="pagination toggle-size inner-0">
          {{#each sizeList}}
            <li class="{{isCurrentSize}}"><a href="#" data-size="{{this}}" class="size">{{this}}</a></li>
          {{/each}}
        </ul>
      </div>
      <div class="pull-left pinner-t-8">
         Showing {{pageSizeOrTotal}} of {{getPluralized 'item' total}} on page {{currentPage}}
      </div>
      <div class="text-center">
        <nav aria-label="Page navigation">
          <ul class="pagination toggle-page inner-0">
            <li>
              <a href="#" aria-label="First" class="go-first">
                <span aria-hidden="true">&laquo;</span>
              </a>
            </li>
            <li>
              <a href="#" aria-label="Previous" class="{{hasPrev}}">
                <span aria-hidden="true">&lsaquo;</span>
              </a>
            </li>
            {{#each page}}
              <li class="{{isCurrent}}"><a href="#" data-page="{{this}}" class="page">{{this}}</a></li>
            {{/each}}
            <li>
              <a href="#" aria-label="Next" class="{{hasNext}}">
                <span aria-hidden="true">&rsaquo;</span>
              </a>
            </li>
            <li>
              <a href="#" aria-label="Last" class="go-last">
                <span aria-hidden="true">&raquo;</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
    <div class="pagination-compact">
      <div class="pagination-compact-rows">
        <span>Show</span>
        <input class="form-control compact-size-input" type="text" value="{{pageListSize}}">
        <span>of {{total}} rows per page</span>
      </div>
      <div class="pagination-compact-pages">
        {{#if hasPrevCompact}}
          <i class="compact-prev fa fa-caret-left"></i>
        {{/if}}
        <span>Page</span>
        <input class="form-control compact-page-input" type="text" value="{{currentPage}}">
        <span>of {{totalPages}}</span>
        {{#if hasNextCompact}}
          <i class="compact-next fa fa-caret-right"></i>
        {{/if}}
      </div>
    </div>
  {{/if}}
</template>

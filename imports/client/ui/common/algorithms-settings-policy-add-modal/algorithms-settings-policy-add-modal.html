<template name="AlgorithmsSettingsPolicyAddModal">
  <!-- Modal: AlgorithmsSettingsPolicyAddModal -->
  <div class="modal fade" id="AlgorithmsSettingsPolicyAddModal" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <h4 class="modal-title">Deny algorithm</h4>
        </div>
        <form id="AlgorithmsSettingsPolicyAddForm" method="post">
          <div class="modal-body">
            <div class="row">
              <div class="form-group col-xs-6">
                <label for="addAlgorithm">Name *</label>
                <select name="addAlgorithm" id="addAlgorithm" class="form-control select2" required>
                  {{#each getAlgorithms}}
                    <option value="{{Algorithm}}">
                      {{Algorithm}}
                    </option>
                  {{/each}}
                </select>
              </div>
              <div class="form-group col-xs-6">
                <label for="strength">Strength (numeric value like 256 or 1024)</label>
                <input type="text" id="strength" name="strength" class="form-control">
              </div>
              <div class="form-group col-xs-12">
                <label for="comment">Comment</label>
                <textarea type="text" id="comment" name="comment" class="form-control"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            {{#if loading}}
              <button type="button" disabled="disabled" class="btn btn-primary">
                <i class="fa fa-spinner fa-spin"></i> Add
              </button>
            {{else}}
              <button type="submit" class="btn btn-primary">
                Add
              </button>
            {{/if}}
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

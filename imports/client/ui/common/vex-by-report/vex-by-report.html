<template name="vexByReport">
  {{#if reportData}}
    <button class="btn btn-primary btn-xs export-as-vex" type="button">
      <span class="fa fa-file-code-o" aria-hidden="true"></span> Export as CSAF
    </button>
  {{else}}
    {{#if isLoading}}
      <button class="btn btn-primary btn-xs export-as-vex relative disabled" type="button" disabled>
        <div class="small-loading">
          <div class="loading-spinner loading-spinner-sm"></div>
        </div>
        <span class="fa fa-file-code-o" aria-hidden="true"></span> Export as CSAF
      </button>
    {{else}}
      <button class="btn btn-primary btn-xs export-as-vex relative" type="button">
        <span class="fa fa-file-code-o" aria-hidden="true"></span> Export as CSAF
      </button>
    {{/if}}
  {{/if}}
</template>

<template name="cvesDetails">
  {{#if hasVulns}}
    <table class="table table-condensed inner-0">
      {{#unless hideDetailsBtns}}
        <thead>
          <tr>
            <th>
              {{#unless hideTitle}}
                <span class="m-r-md">Vulnerabilities</span>
              {{/unless}}
              {{#unless mappedVulns}}
                {{#if requestInProgress}}
                  <button class="btn btn-xs btn-default ">
                    <i class="fa fa-spinner fa-spin"></i>
                    Loading results, please wait...
                  </button>
                {{else}}
                  <button class="get_details btn btn-xs btn-default" type="button">Get details</button>
                {{/if}}
              {{else}}
                <button class="less_details btn btn-xs btn-default" type="button">
                  <i class="fa fa-times"></i>
                  Less details
                </button>
              {{/unless}}
              {{#unless hideConfidence}}
                <div class="clearfix relative inline-block" style="width: auto" title="Select minimum level of confidence">
                  <button type="button" class="btn btn-default btn-xs btn-block dropdown-toggle"
                          data-toggle="dropdown">
                    <div class="text-left">
                      <i class="fa fa-signal" aria-hidden="true"></i> Confidence: {{confidenceCurrent}}
                    </div>
                  </button>
                  <ul class="dropdown-menu w-100">
                    {{#each confidenceVariants}}
                      <li>
                        <a class="change_confidence truncate" data-value="{{value}}" href title="{{label}}">
                          {{label}}
                        </a>
                      </li>
                    {{/each}}
                  </ul>
                </div>
              {{/unless}}
            </th>
          </tr>
        </thead>
      {{/unless}}
      <tbody>
      {{#unless hideDetailsBumpHints}}
        <tr>
          <td class="inner-l-5">
            {{> cvesBumpHints vulns=vulnsFiltered confidence=confidenceMinScore }}
          </td>
        </tr>
      {{/unless}}
      {{#unless mappedVulns}}
        {{#each vulnsFiltered}}
          <tr>
            <td class="{{cellClass}}">
              {{#if allowMute}}
                {{#if isCveWhiteListedAnywhere}}
                  <button class="btn btn-xs btn-default pull-right remove_cve_whitelist_single" type="button" title="Vulnerability is muted">
                    <span class="fa fa-bell-slash-o"></span>
                  </button>
                {{else}}
                  <div class="pull-right relative inline-block" style="width: auto" title="Vulnerability notification enabled">
                    <button type="button" class="btn btn-default btn-xs btn-block dropdown-toggle"
                            data-toggle="dropdown" style="width: auto">
                      <div class="text-left">
                        <span class="fa fa-bell-o"></span>
                      </div>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-right">
                      <li>
                        <a class="add_cve_whitelist_fast_single" data-value="1" href title="False positive, not applicable to us">
                          False positive, not applicable to us
                        </a>
                      </li>
                      <li>
                        <a class="add_cve_whitelist_fast_single" data-value="2" href title="Vulnerable code not in use">
                          Vulnerable code not in use
                        </a>
                      </li>
                      <li>
                        <a class="add_cve_whitelist_fast_single" data-value="3" href title="Risk is tolerable, won't fix">
                          Risk is tolerable, won't fix
                        </a>
                      </li>
                      <li>
                        <a class="add_cve_whitelist_fast_single" data-value="4" href title="Fix is about to be implemented">
                          Fix is about to be implemented
                        </a>
                      </li>
                      <li>
                        <a class="add_cve_whitelist_fast_single" data-value="5" href title="Fix has been provided">
                          Fix has been provided
                        </a>
                      </li>
                      <li>
                        <a class="add_cve_whitelist_single">
                          Other
                        </a>
                      </li>
                    </ul>
                  </div>
                {{/if}}
              {{/if}}
              <a target="_blank" href="{{getRef}}">
                {{#if getCisa}}
                  {{#with getCisa}}
                    <span class="inline-block m-r-xs cisa-icon fa fa-user-secret text-violations" title="CISA Exploit alert! Added: {{dateAdded}}, Required action: {{requiredAction}}"></span>
                  {{/with}}
                {{/if}}
<!--                <span class="inline-block m-r-xs">{{getItemIndex @index}}</span>-->
                {{#unless hideConfidenceDetails}}
                  {{#if hasConfidence}}
                    <label class="label confidence-label confidence-label-{{getConfidenceClass}} inner-t-1"
                           title="Confidence level {{getConfidenceLevel}} ({{getConfidenceScore}}/5) based on {{getConfidenceVendor}}:{{getConfidenceProduct}}">
                      <i class="fa fa-signal confidence-cols" aria-hidden="true"></i>
                    </label>
                  {{/if}}
                {{/unless}}
                {{#if hasScore}}
                  {{{cvssLabelCompact getScore getCVSSColor getScore}}}
                {{/if}}
                <span class="inline-block m-l-xs">{{getName}}</span>
                <span class="fa fa-external-link"></span>
              </a>
              {{#if getEnvironmental}}
                <p class="inner-b-5">Base score {{{cvssLabelCompact getBaseScore 'grey' getBaseScore}}} was modified by Environmental settings</p>
              {{/if}}
              {{#if getDescription}}
                <p style="word-break: break-word;">{{getDescription}}</p>
              {{/if}}
              {{#if getWhitelistEntry}}
                {{#with getWhitelistEntry}}
                  <p class="inner-t-5 inner-b-5"><b>CVE is muted</b>: {{comment}}</p>
                {{/with}}
              {{/if}}
            </td>
          </tr>
        {{/each}}
      {{else}}
        {{#each mappedVulns}}
          <tr>
            <td class="{{cellClass}}">
              {{#if allowMute}}
                {{#if isCveWhiteListedAnywhere}}
                  <button class="btn btn-xs btn-default pull-right remove_cve_whitelist" type="button" title="Vulnerability is muted">
                    <span class="fa fa-bell-slash-o"></span>
                  </button>
                {{else}}
                  <div class="pull-right relative inline-block" style="width: auto" title="Vulnerability notification enabled">
                    <button type="button" class="btn btn-default btn-xs btn-block dropdown-toggle"
                            data-toggle="dropdown" style="width: auto">
                      <div class="text-left">
                        <span class="fa fa-bell-o"></span>
                      </div>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-right">
                      <li>
                        <a class="add_cve_whitelist_fast" data-value="1" href title="False positive, not applicable to us">
                          False positive, not applicable to us
                        </a>
                      </li>
                      <li>
                        <a class="add_cve_whitelist_fast" data-value="2" href title="Vulnerable code not in use">
                          Vulnerable code not in use
                        </a>
                      </li>
                      <li>
                        <a class="add_cve_whitelist_fast" data-value="3" href title="Risk is tolerable, won't fix">
                          Risk is tolerable, won't fix
                        </a>
                      </li>
                      <li>
                        <a class="add_cve_whitelist_fast" data-value="4" href title="Fix is about to be implemented">
                          Fix is about to be implemented
                        </a>
                      </li>
                      <li>
                        <a class="add_cve_whitelist_fast" data-value="5" href title="Fix has been provided">
                          Fix has been provided
                        </a>
                      </li>
                      <li>
                        <a class="add_cve_whitelist">
                          Other
                        </a>
                      </li>
                    </ul>
                  </div>
                {{/if}}
              {{/if}}
              {{#if getLastModified}}
                <span class="pull-right inner-r-5" title="Last modified">
                  <span class="fa fa-clock-o"></span>
                  {{{dateFromNow getLastModified}}}
                </span>
              {{/if}}
              <a target="_blank" href="{{getRef}}">
                {{#if getCisa}}
                  {{#with getCisa}}
                    <span class="inline-block m-r-xs cisa-icon fa fa-user-secret text-violations" title="CISA Exploit alert! Added: {{dateAdded}}, Required action: {{requiredAction}}"></span>
                  {{/with}}
                {{/if}}
                {{#unless hideConfidenceDetails}}
                  <label class="label confidence-label confidence-label-{{getConfidenceClass}} inner-t-1"
                         title="Confidence level {{getConfidenceLevel}} ({{getConfidenceScore}}/5) based on {{getConfidenceVendor}}:{{getConfidenceProduct}}">
                    <i class="fa fa-signal confidence-cols" aria-hidden="true"></i>
                  </label>
                {{/unless}}
                {{{cvssLabelCompact getScore getCVSSColor getScore}}}
                <span class="inline-block m-l-xs">{{getName}}</span>
                <span class="fa fa-external-link"></span>
              </a>
              {{#if getEnvironmental}}
                <p class="inner-b-5">Base score {{{cvssLabelCompact getBaseScore 'grey' getBaseScore}}} was modified by Environmental settings</p>
              {{/if}}
              <p class="inner-b-0">
                {{#if getWeakness}}
                  <span title="Weakness"><a href="{{getWeaknessUrl}}" target="_blank" title="{{ getWeakness }}">{{ getWeakness }} <span class="fa fa-external-link"></span></a></span> -
                {{/if}}
                {{#if getVector}}
                  <span title="Base Score (vectoral)">{{parseVector getVector }}</span>
                {{/if}}
                {{#if getExploitscore}}
                  <span title="Exploit score"> Exploit: {{ getExploitscore }}</span>
                {{/if}}
                {{#if getImpactscore}}
                  <span title="Impact score"> Impact: {{ getImpactscore }}</span>
                {{/if}}
              </p>
              {{#if getDescription}}
                <p style="word-break: break-word;">{{getDescription}}</p>
              {{/if}}
              {{#if getWhitelistEntry}}
                {{#with getWhitelistEntry}}
                  <p class="inner-t-5 inner-b-5"><b>CVE is muted</b>: {{comment}}</p>
                {{/with}}
              {{/if}}
            </td>
          </tr>
        {{/each}}
      {{/unless}}
      {{#if confidenceFiltered}}
        <tr>
          <td>
            <div class="aside-section">
              <div class="aside-section-content">
                Some vulnerabilities are hidden via <i class="fa fa-signal" aria-hidden="true"></i> Confidence filter
              </div>
            </div>
          </td>
        </tr>
      {{/if}}
      </tbody>
    </table>
  {{/if}}
</template>

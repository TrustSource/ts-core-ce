<template name="capabilitiesList">
  <div class="ts-panel {{#if collapsed}}panel-collapse{{/if}}">
    <div class="panel-heading">
      {{> panelTools }}
      {{title}}
    </div>
    <div class="panel-body {{#if collapsed}}collapsed{{/if}}" style="{{#if collapsed}}display:none{{/if}}">
      {{#if hasAccessRight 'module.capabilities.settings' 'w' currentModule}}
        <div class="pull-left">
          <a class="btn btn-primary" data-toggle="modal" data-target="#CapabilitiesAddModal" title="Add capability">
            <span class="fa fa-plus" aria-hidden="true"></span>
            Add capability
          </a>
          {{> CapabilitiesAddModal}}
        </div>
      {{/if}}
      {{#if this.data}}
        {{#if editId}}
          {{> CapabilitiesEditModal id=id data=editDetails}}
        {{/if}}
        <form autocomplete="off">
          {{> reactiveTable settings=reactiveTableSettings}}
        </form>
      {{/if}}
    </div>
  </div>
</template>

<template name="reactiveTableCapabilitiesSettingsActions">
  <div class="text-right">
    {{#if hasAccessRight 'module.capabilities.settings' 'w' currentModule}}
      <button type="button" class="btn btn-primary btn-xs edit-capabilities">
        <i class="fa fa-pencil"></i>
      </button>
      <button type="button" class="btn btn-danger btn-xs remove-capabilities">
        <i class="fa fa-trash-can"></i>
      </button>
    {{/if}}
  </div>
</template>

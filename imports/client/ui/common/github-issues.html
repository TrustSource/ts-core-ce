<template name="githubIssuesLink">
  {{#unless noGithub}}
    <div>
      {{#if githubId}}
        <a class="view-github" href="{{githubApp}}{{githubId}}" target="_blank">
          <span class="integration-icon github integration-lg "></span> {{githubTaskStatus}}
        </a>
        <a class="fa fa-remove remove-github" role="button" tabindex="0" title="Remove GitHub issue" aria-label="Remove GitHub issue"></a>
      {{else}}
        <a class="show-github-modal" role="button" tabindex="0" aria-label="Create issue in GitHub">
          <span class="integration-icon github-disabled integration-lg "></span> Create issue
        </a>
        <!-- Modal: createIssue -->
        <div class="modal fade createIssue" tabindex="-1" role="dialog" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="ts-accent-line"></div>
              <div class="modal-header text-center">
                <i class="fa fa-check-square-o ts-big-icon text-success"></i>
                <br/>
                <h4 class="modal-title">Create new GitHub issue</h4>
                <br/>
                <div class="{{createIssueMsgType}}" id="form-messages">{{createIssueMsg}}</div>
              </div>
              <form class="createIssueForm">
                <div class="modal-body text-left">
                  <div class="form-group ">
                    <label for="">Title</label>
                    <input type="text" value="" name="modalTitle" class="form-control">
                    <span class="help-block small">Specify the title of issue</span>
                  </div>
                  <div class="form-group ">
                    <label for="">Description</label>
                    <textarea value="" name="modalDescription" class="form-control" rows="5"></textarea>
                    <span class="help-block small">Specify the description of issue</span>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                  <button type="submit" class="btn btn-primary create-github">Create issue</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      {{/if}}
    </div>
  {{/unless}}
</template>

<template name="projectSettingsObligations">
  <div id="obligations" class="tab-pane">
    <div class="panel-body no-bottom-errors">
      <div class="clearfix">
        <div class="pull-right actions actions-wizard" style="position:relative">
          {{#if hasAccessRight 'project.obligationConfig.import' 'x' currentProject}}
            <div class="inline-block relative">
              {{#if getObligationSettings.length}}
                <button type="button" class="btn btn-default btn-xs dropdown-toggle"
                        data-toggle="dropdown">
                  <span class="fa fa-copy"></span> Import settings from Project <span class="caret"></span>
                </button>
                <ul class="dropdown-menu">
                  <li>
                    <input type="text" class="drop-filter form-control import_filter" placeholder="Search by name"
                           value="{{getImportFilter}}"/>
                  </li>
                  {{#each filterList getObligationSettings getImportFilter}}
                    <li><a class="copy-obligation-settings" id="{{_id}}">{{name}}</a></li>
                  {{/each}}
                </ul>
              {{/if}}
            </div>
          {{/if}}
          {{#if hasAccessRight 'project.obligationConfig.propagate' 'x' currentProject}}
            <div class="inline-block relative">
              {{#if otherProjects.length}}
                <button type="button" class="btn btn-default btn-xs dropdown-toggle"
                        data-toggle="dropdown">
                  <span class="fa fa-share"></span> Propagate settings to...<span
                        class="caret"></span>
                </button>
                <ul class="dropdown-menu dropdown-menu-right">
                  <li>
                    <input type="text" class="drop-filter form-control project_filter" placeholder="Search by name"
                           value="{{getProjectFilter}}"/>
                  </li>

                  {{#if isInRole 'portfolio_manager' companyId}}
                    <li><a class="propagate-all-obligation-settings">All {{otherProjects.length}} projects</a></li>
                  {{/if}}
                  <li><a class="propagate-all-my-obligation-settings">All my {{myProjects.length}} projects</a></li>
                  {{#each filterList otherProjects getProjectFilter}}
                    <li><a class="propagate-obligation-settings" id="{{_id}}">{{name}}</a></li>
                  {{/each}}
                </ul>
              {{/if}}
            </div>
          {{/if}}
        </div>
      </div>
      {{#with hasFieldRight 'project.obligationConfig.list' currentProject}}
        {{#if read}}
          {{> obligationConfigList
                  title="List of completed constraints of project"
                  id="prjObligationConfig"
                  data=getObligation
                  schema=getObligationSchema
                  docId=currentProject._id
                  collection=getProjects
                  attribute="obligationConfig"
                  readonly=disabled
          }}
        {{/if}}
      {{/with}}
    </div>
  </div>
</template>

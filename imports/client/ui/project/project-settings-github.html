<template name="projectSettingsGithub">
  <form class="form-horizontal github-project">
    {{#with hasFieldRight 'project.issue.github.settings' currentProject}}
      {{#if read}}
        <div class="form-group">
          <label class="col-sm-2 control-label" for="github-token">Access Token *</label>
          <div class="col-sm-4 controls">
            <input type="password" autocomplete="off" id="github-token" name="github-token"
                   placeholder="Leave blank to keep current" class="form-control"
                   disabled="{{isMultyGithubUnavailable}}"/>
          </div>
        </div>
        <div class="form-group">
          <label class="col-sm-2 control-label" for="github-repository">Repository</label>
          <div class="col-sm-4 controls">
            <input type="text" autocomplete="off" id="github-repository" name="github-repository" value="{{currentProject.github.repository}}"
                   placeholder="Repository (optional)" class="form-control" disabled="{{isMultyGithubUnavailable}}"/>
          </div>
        </div>
      {{/if}}
    {{/with}}
    {{#with hasFieldRight 'project.issue.github.active' currentProject}}
      {{#if read}}
        <div class="form-group">
          <label class="col-sm-2 control-label" for="github-active">Active *</label>
          <div class="col-sm-4 pinner-t-8">
            <input type="checkbox" id="github-active" name="github-active" value="true"
                   checked="{{currentProject.github.active}}"
                   placeholder="Active" disabled="{{isMultyGithubUnavailable}}"/>
          </div>
        </div>
      {{/if}}
    {{/with}}
    {{#with hasFieldRight 'project.issue.github' currentProject}}
      {{#unless disabled}}
        <div class="form-group">
          <div class="col-sm-offset-2 col-sm-4">
            <button type="button" class="btn btn-primary"
                    disabled="{{isMultyGithubUnavailable}}">
              Update
            </button>
          </div>
        </div>
      {{/unless}}
    {{/with}}
  </form>
</template>

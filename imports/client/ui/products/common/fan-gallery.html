<template name="fanGallery">
  <div class="fan-carousel" tabindex="0">
    <div class="fan-carousel__viewport">
      {{#each images}}
        <div class="fan-carousel__slide" data-index="{{@index}}">
          <img
            data-src="{{this}}"
            width="630"
            height="630"
            alt="Image {{@index}}"
          />
        </div>
      {{/each}}
    </div>
  </div>
  <style>
    .fan-carousel {
      position: relative;
      width: 100%;
      height: 350px;
      overflow: hidden;
      perspective: 1200px;
      outline: none;
    }
    .fan-carousel__viewport {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120%;
      height: 100%;
    }
    .fan-carousel__slide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-style: preserve-3d;
    }
    .fan-carousel__slide img {
      width: 300px;
      height: 300px;
      border-radius: 12px;
      object-fit: cover;
      transition:
        transform 0.75s ease,
        filter 0.75s ease,
        opacity 0.75s ease;
      transform:
        translateX(var(--f-translateX))
        translateZ(var(--f-translateZ))
        rotateY(var(--f-rotateY))
        scale(var(--f-scale));
      box-shadow: 0 12px 35px rgba(0,0,0,0.25);
      cursor: pointer;
    }

    .fan-carousel__slide img:hover {
      box-shadow: 0 16px 45px rgba(0,0,0,0.35);
    }

    @media (max-width: 700px) {
      .fan-carousel__slide img {
        width: 60vw;
        height: auto;
      }
    }


  </style>
</template>

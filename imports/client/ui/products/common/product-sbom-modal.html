<template name="productSbomModal">
  <!-- Modal: productSbomModal -->
  <div class="modal fade" id="productSbomModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <h4 class="modal-title">Generate SBOM by solutions</h4>
        </div>
        <form id="productSbomForm" enctype="multipart/form-data" method="post">
          <div class="modal-body">
            <div class="row">
              <div class="form-group col-sm-12">
                <p class="alert alert-info inner-b-0">
                  You may generate SBOM file based on selected solutions.
                  Please ensure you completed selection before generation.
                  Generated file will be available in documents tab.
                </p>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            {{#if loading}}
              <button type="button" disabled="disabled" class="btn btn-primary">
                <i class="fa fa-spinner fa-spin"></i> Generate SBOM
              </button>
            {{else}}
              <button type="submit" class="btn btn-primary">
                Generate SBOM
              </button>
            {{/if}}
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

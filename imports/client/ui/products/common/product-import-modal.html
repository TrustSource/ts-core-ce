<template name="productImportModal">
  <!-- Modal: productImportModal -->
  <div class="modal fade" id="productImportModal" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <h4 class="modal-title">Import product structure</h4>
        </div>
        <form id="productImportForm" enctype="multipart/form-data" method="post">
          <div class="modal-body">
            <div class="row">
              <div class="form-group col-xs-12">
                Upload a product structure as JSON (see the <a target="_blank" href="/products-import.json" class="highlight">example file</a>).
                The whole file is checked first; if a row is invalid, nothing is imported.
              </div>
              <div class="form-group col-xs-12 inner-b-5">
                <label class="control-label checkbox-inline">
                  <input type="checkbox" id="draft" name="draft">
                  <strong>Draft</strong>
                </label>
                <span class="help-block small">Allows you to run a test. You will be able to remove all test data at once</span>
              </div>
              <div class="form-group col-sm-12">
                <label for="parentId">Parent</label>
                <select class="form-control select2" name="parentId" id="parentId">
                  <option value=""></option>
                  {{#each productList}}
                    <option value="{{identifier}}" label="{{name}} [{{type}}]" selected="{{isSelected identifier}}">{{name}} [{{type}}]</option>
                  {{/each}}
                </select>
              </div>
              <div class="form-group col-xs-12">
                <label for="file">File *</label>
                <div class="input-group input-group-file">
                  {{#with currentUpload}}
                    <span class="input-group-btn">
                        <span class="btn btn-default btn-file">
                          Uploading...
                        </span>
                      </span>
                    <input type="text" name="file" readonly="readonly" placeholder="{{file.name}}" class="form-control">
                  {{else}}
                    <span class="input-group-btn">
                        <span class="btn btn-default btn-file">
                          Browse...
                          <input type="file" name="file" id="file" accept=".json">
                        </span>
                      </span>
                    <input type="text" name="filename" readonly="readonly" placeholder="file name" class="form-control">
                  {{/with}}
                </div>
                {{#with currentUpload}}
                  <span id="progress">{{progress.get}}%</span>
                {{/with}}
              </div>
              <div class="form-group col-xs-12">
                <span class="help-block small">Specify the import file (*.json)</span>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            {{#if loading}}
              <button type="button" disabled="disabled" class="btn btn-primary">
                <i class="fa fa-spinner fa-spin"></i> Import
              </button>
            {{else}}
              <button type="submit" class="btn btn-primary">
                Import
              </button>
            {{/if}}
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

<template name="productLinkWithRelease">
    <!-- Modal: productLinkWithReleaseModal -->
    <div class="modal fade" id="productLinkWithReleaseModal" tabindex="-1" role="dialog" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="ts-accent-line"></div>
          <div class="modal-header text-center">
            <h4 class="modal-title">Add solution</h4>
            {{#if loading}}
              {{>loadingSplash}}
            {{/if}}
          </div>
          <div class="modal-body">
            {{> reactiveTable settings=reactiveTableSettings}}
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
</template>

<template name="reactiveTableProductsLinkRelease">
  <button class="btn btn-primary btn-sm link-with"><span class="fa fa-add" aria-hidden="true"></span> Add</button>
</template>

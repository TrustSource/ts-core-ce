<template name="TestImportModal">
  <!-- Modal: TestImportModal -->
  <div class="modal fade" id="TestImportModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="ts-accent-line"></div>
        <div class="modal-header text-center">
          <h4 class="modal-title">{{__ 'ImportTest'}}</h4>
        </div>
        <form id="TestImportForm" enctype="multipart/form-data" method="post">
          <div class="modal-body">
            <div class="row">
              <div class="form-group col-xs-12">
                {{__ 'YouMayAddTestResultsIn'}} <a target="_blank" href="https://docs.oasis-open.org/sarif/sarif/v2.1.0/sarif-v2.1.0.pdf" class="highlight">{{__ 'SARIF'}}</a>{{__ 'FormatFrom3rdPartTest'}}
                 <a target="_blank" href="{{pathFor route='apiDocLatest'}}" class="highlight">{{__ 'ReadMore'}}</a>
              </div>
              <div class="form-group col-xs-12">
                <label for="file">File</label>
                <div class="input-group input-group-file">
                  {{#with currentUpload}}
                    <span class="input-group-btn">
                        <span class="btn btn-default btn-file">
                          {{__ 'Uploading'}}
                        </span>
                      </span>
                    <input type="text" name="file" readonly="readonly" placeholder="{{file.name}}" class="form-control">
                  {{else}}
                    <span class="input-group-btn">
                        <span class="btn btn-default btn-file">
                          {{__ 'Browse'}}
                          <input type="file" name="file" id="file" accept=".sarif, .json">
                        </span>
                      </span>
                    <input type="text" name="filename" readonly="readonly" placeholder="file name" class="form-control">
                  {{/with}}
                </div>
                {{#with currentUpload}}
                  <span id="progress">{{progress.get}}%</span>
                {{/with}}
              </div>
              <div class="form-group col-xs-12">
                <span class="help-block small">{{__ 'SpecifyTheSARIFFile'}} (*.sarif/*.json)</span>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">{{__ 'Close'}}</button>
            {{#if loading}}
              <button type="button" disabled="disabled" class="btn btn-primary">
                <i class="fa fa-spinner fa-spin"></i> {{__ 'Import'}}
              </button>
            {{else}}
              <button type="submit" class="btn btn-primary">
                {{__ 'Import'}}
              </button>
            {{/if}}
          </div>
        </form>
      </div>
    </div>
  </div>
</template>

# Reference Community Edition setup: MongoDB, the app, the license check service and a
# local mail catcher. Files live on the named volume `ts-files`; start more app
# containers with the same volume mounted to share them.
# Every app container must mount the files volume at the same METEOR_UPLOAD_FOLDER path, writable by the
# image's `meteor` user (a named volume inherits that ownership; a bind mount needs matching ownership).
#
# Copy `.env.example` to `.env` and fill in the five required settings
# (INITIAL_ADMIN_EMAIL, INITIAL_ADMIN_PASSWORD, TS_ENCRYPTION_KEY,
# MONGO_ROOT_PASSWORD, MONGO_APP_PASSWORD) before `docker compose up`. The shell
# environment works too.
#
# The app listens on 127.0.0.1:3000 only. Put a TLS reverse proxy in front of it to
# serve users, or set TS_BIND_ADDRESS=0.0.0.0 to publish it on every interface.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=meteor
      # The app connects as this user (readWrite on `meteor` only), created when the
      # volume is first initialised.
      - MONGO_APP_USERNAME=${MONGO_APP_USERNAME:-trustsource}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 5s
      retries: 5

  ts_core:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://${MONGO_APP_USERNAME:-trustsource}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}@mongo:27017/meteor?authSource=meteor
      - PORT=3000
      - ROOT_URL=${ROOT_URL:-http://localhost:3000/}
      - METEOR_UPLOAD_FOLDER=/app.storage/files
      - MAIL_SENDER=${MAIL_SENDER:-noreply@localhost}
      - MAIL_URL=${MAIL_URL:-smtp://mailpit:1025}
      - TS_CHECK_SERVER=http://ts_legalcheck:5000/
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:?set INITIAL_ADMIN_EMAIL}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD}
      - INITIAL_COMPANY_NAME=${INITIAL_COMPANY_NAME:-}
      - TS_ENCRYPTION_KEY=${TS_ENCRYPTION_KEY:?set TS_ENCRYPTION_KEY}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-false}
      - TS_OSV_ENABLED=${TS_OSV_ENABLED:-true}
      - TS_EPSS_ENABLED=${TS_EPSS_ENABLED:-true}
      - TS_ALLOWED_DDP_ORIGINS=${TS_ALLOWED_DDP_ORIGINS:-}
      # Number of reverse proxies in front of the app; the client IP (sign-in rate
      # limits, login history) is then read from X-Forwarded-For.
      - HTTP_FORWARDED_COUNT=${HTTP_FORWARDED_COUNT:-0}
      - TS_ANALYSIS_CONCURRENCY=${TS_ANALYSIS_CONCURRENCY:-2}
      # Internal hosts integrations may reach (on-premises Jira, internal webhooks).
      - TS_ALLOWED_PRIVATE_HOSTS=${TS_ALLOWED_PRIVATE_HOSTS:-}
      # Largest file one REST upload may send, in MB.
      - TS_UPLOAD_MAX_MB=${TS_UPLOAD_MAX_MB:-50}
      # Vulnerability alert sweep over approved releases.
      - TS_VULN_ALERT_SWEEP=${TS_VULN_ALERT_SWEEP:-true}
      - TS_VULN_ALERT_INTERVAL_MIN=${TS_VULN_ALERT_INTERVAL_MIN:-60}
      - TS_VULN_ALERT_PROJECT_BATCH=${TS_VULN_ALERT_PROJECT_BATCH:-25}
      - TS_VULN_ALERT_RELEASE_BATCH=${TS_VULN_ALERT_RELEASE_BATCH:-10}
      # Verbose debug logging (credentials are redacted).
      - DEBUG_MODE_ENABLED=${DEBUG_MODE_ENABLED:-false}
      # Recovery: turns off 2FA of this login at startup, see .env.example.
      - TS_RESET_2FA=${TS_RESET_2FA:-}
      # Key rotation and data written by an older installation, see .env.example.
      - TS_ENCRYPTION_KEY_PREVIOUS=${TS_ENCRYPTION_KEY_PREVIOUS:-}
      - TS_ENCRYPTION_KEY_LEGACY=${TS_ENCRYPTION_KEY_LEGACY:-}
      - TS_REENCRYPT_SECRETS=${TS_REENCRYPT_SECRETS:-}
      # Startup check for a newer version; set TS_UPDATE_CHECK=false to turn it off.
      - TS_UPDATE_CHECK=${TS_UPDATE_CHECK:-true}
      - TS_UPDATE_CHECK_URL=${TS_UPDATE_CHECK_URL:-}
      # Optional: operator details shown in the footer of outgoing mails.
      - TS_OPERATOR_NAME=${TS_OPERATOR_NAME:-}
      - TS_SUPPORT_EMAIL=${TS_SUPPORT_EMAIL:-}
      - TS_IMPRINT_URL=${TS_IMPRINT_URL:-}
      # Optional: the CSAF provider advisories are published to. Publishing fails
      # with a message naming these until all three are set.
      - TS_CSAF_PROVIDER_URL=${TS_CSAF_PROVIDER_URL:-}
      - TS_CSAF_PROVIDER_PASSPHRASE=${TS_CSAF_PROVIDER_PASSPHRASE:-}
      - TS_CSAF_PROVIDER_PASSWORD=${TS_CSAF_PROVIDER_PASSWORD:-}
    volumes:
      - ts-files:/app.storage/files
    ports:
      - "${TS_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      mongo:
        condition: service_healthy
      ts_legalcheck:
        condition: service_started

  ts_legalcheck:
    image: trustsource/ts-legalcheck:1.1.2
    # Published for amd64 only; ARM hosts (Apple silicon, Graviton) run it emulated.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - TS_LEGALCHECK_WEBUI_PORT=5000
    volumes:
      - ./docker/ts-legalcheck-api.py:/app/ts-legalcheck-api.py:ro
    entrypoint: ["python", "/app/ts-legalcheck-api.py"]

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  mongo-data:
  ts-files:
